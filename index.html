<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شباهنگ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 25%, #202044 0%, #0b0b18 42%, #030309 100%);
    color: white;
    font-family: "Vazirmatn", sans-serif;
}


/* =========================
   SKY
========================= */

.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.sky::before {
    content: "";
    position: absolute;
    inset: -20%;
    background:
        radial-gradient(circle at 20% 30%, rgba(105, 90, 255, .10), transparent 25%),
        radial-gradient(circle at 80% 20%, rgba(120, 150, 255, .08), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(80, 60, 160, .08), transparent 30%);
}


/* =========================
   STARS
========================= */

.stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 7px rgba(255,255,255,.8);
    animation: twinkle 3s infinite ease-in-out;
}

.star:nth-child(1) { left: 8%; top: 17%; animation-delay: .2s; }
.star:nth-child(2) { left: 16%; top: 31%; animation-delay: 1s; }
.star:nth-child(3) { left: 25%; top: 12%; animation-delay: 1.7s; }
.star:nth-child(4) { left: 35%; top: 23%; animation-delay: .5s; }
.star:nth-child(5) { left: 44%; top: 10%; animation-delay: 2s; }
.star:nth-child(6) { left: 56%; top: 17%; animation-delay: 1.2s; }
.star:nth-child(7) { left: 66%; top: 8%; animation-delay: .3s; }
.star:nth-child(8) { left: 77%; top: 26%; animation-delay: 1.8s; }
.star:nth-child(9) { left: 87%; top: 14%; animation-delay: .7s; }
.star:nth-child(10) { left: 93%; top: 38%; animation-delay: 2.2s; }
.star:nth-child(11) { left: 11%; top: 53%; animation-delay: 1.4s; }
.star:nth-child(12) { left: 29%; top: 44%; animation-delay: .9s; }
.star:nth-child(13) { left: 72%; top: 48%; animation-delay: 2.1s; }
.star:nth-child(14) { left: 82%; top: 61%; animation-delay: .4s; }
.star:nth-child(15) { left: 52%; top: 55%; animation-delay: 1.6s; }
.star:nth-child(16) { left: 39%; top: 67%; animation-delay: .8s; }
.star:nth-child(17) { left: 18%; top: 72%; animation-delay: 2.4s; }
.star:nth-child(18) { left: 91%; top: 76%; animation-delay: 1.1s; }
.star:nth-child(19) { left: 62%; top: 34%; animation-delay: 1.9s; }
.star:nth-child(20) { left: 47%; top: 39%; animation-delay: .6s; }

@keyframes twinkle {
    0%, 100% {
        opacity: .25;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}


/* =========================
   NEW MOON
========================= */

.moon {
    position: absolute;
    width: 190px;
    height: 190px;

    top: 9%;
    left: 50%;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 38% 35%,
            #fff,
            #e9e9ff 38%,
            #bdbdf0 70%,
            #7778ad 100%
        );

    box-shadow:
        0 0 25px rgba(225,225,255,.65),
        0 0 70px rgba(160,160,255,.35),
        0 0 140px rgba(120,120,255,.15);

    opacity: .95;
}


/* Moon craters */

.moon::before {
    content: "";
    position: absolute;
    width: 32px;
    height: 32px;
    border-radius: 50%;

    left: 35px;
    top: 48px;

    background: rgba(110,110,155,.18);

    box-shadow:
        65px 20px 0 10px rgba(110,110,155,.12),
        85px 80px 0 5px rgba(100,100,145,.15),
        35px 105px 0 8px rgba(100,100,145,.12),
        110px 125px 0 4px rgba(100,100,145,.15);
}


/* Moon glow */

.moon::after {
    content: "";
    position: absolute;
    inset: -25px;

    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(180,180,255,.18),
        transparent 65%
    );

    z-index: -1;
}


/* =========================
   SHOOTING STAR
========================= */

.shooting-star {
    position: absolute;
    width: 130px;
    height: 2px;

    top: 25%;
    left: -150px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.9)
    );

    transform: rotate(-25deg);

    animation: shooting 9s linear infinite;
}

@keyframes shooting {

    0% {
        left: -180px;
        opacity: 0;
    }

    8% {
        opacity: 1;
    }

    20% {
        left: 110%;
        opacity: 0;
    }

    100% {
        left: 110%;
        opacity: 0;
    }
}


/* =========================
   CITY
========================= */

.city {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 17%;

    background:
        linear-gradient(
            to top,
            #020207,
            rgba(4,4,12,.92)
        );

    clip-path: polygon(
        0 35%,
        5% 35%,
        5% 22%,
        10% 22%,
        10% 42%,
        15% 42%,
        15% 18%,
        20% 18%,
        20% 32%,
        25% 32%,
        25% 12%,
        30% 12%,
        30% 38%,
        36% 38%,
        36% 25%,
        42% 25%,
        42% 44%,
        48% 44%,
        48% 20%,
        54% 20%,
        54% 34%,
        60% 34%,
        60% 15%,
        66% 15%,
        66% 40%,
        73% 40%,
        73% 25%,
        80% 25%,
        80% 12%,
        86% 12%,
        86% 37%,
        92% 37%,
        92% 22%,
        100% 22%,
        100% 100%,
        0 100%
    );
}


/* =========================
   MAIN GLASS PANEL
========================= */

.container {
    position: relative;
    z-index: 5;

    width: min(850px, 90vw);
    min-height: 530px;

    margin: auto;

    top: 50%;
    transform: translateY(-50%);

    padding: 55px;

    border-radius: 35px;

    /* کاملاً مات‌تر */
    background: rgba(10, 10, 24, .88);

    border: 1px solid rgba(255,255,255,.12);

    box-shadow:
        0 35px 100px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.08);

    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);

    overflow: hidden;
}


/* نور خیلی ظریف داخل شیشه */

.container::before {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;

    top: -250px;
    right: -150px;

    background: radial-gradient(
        circle,
        rgba(120,110,255,.10),
        transparent 70%
    );

    pointer-events: none;
}


/* =========================
   TITLE
========================= */

.title {
    text-align: center;
    position: relative;
    z-index: 2;
}

.title h1 {

    font-size: clamp(55px, 8vw, 90px);

    font-weight: 400;

    letter-spacing: -4px;

    color: #e9e8ff;

    text-shadow:
        0 0 25px rgba(150,145,255,.35),
        0 0 60px rgba(100,95,255,.15);

    margin-bottom: 40px;
}


/* =========================
   PLAYER
========================= */

.player {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
}


/* Vinyl */

.record {
    width: 180px;
    height: 180px;

    border-radius: 50%;

    background:
        repeating-radial-gradient(
            circle,
            #0b0b10 0px,
            #0b0b10 3px,
            #161620 4px,
            #0b0b10 6px
        );

    border: 5px solid #08080d;

    box-shadow:
        0 15px 40px rgba(0,0,0,.55),
        inset 0 0 25px rgba(255,255,255,.04);

    position: relative;

    transition: .4s;
}


.record.playing {
    animation: spin 5s linear infinite;
}

@keyframes spin {
    from {
        transform: rotate(0);
    }

    to {
        transform: rotate(360deg);
    }
}


/* Center */

.record::after {
    content: "";

    position: absolute;

    width: 48px;
    height: 48px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #b9b5ff 0 8px,
            #171722 9px 100%
        );

    box-shadow:
        0 0 15px rgba(150,145,255,.35);
}


/* =========================
   SONG NAME
========================= */

.song-name {
    font-size: 16px;
    font-weight: 400;
    color: rgba(255,255,255,.72);
}


/* =========================
   BUTTON
========================= */

.play-btn {

    width: 62px;
    height: 62px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.15);

    background: rgba(255,255,255,.07);

    color: white;

    font-size: 20px;

    cursor: pointer;

    transition: .3s;

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);
}

.play-btn:hover {

    transform: scale(1.08);

    background: rgba(150,145,255,.18);

    box-shadow:
        0 0 30px rgba(130,125,255,.25);
}


/* =========================
   PROGRESS
========================= */

.progress {

    width: min(430px, 80%);

    appearance: none;

    height: 3px;

    border-radius: 10px;

    background: rgba(255,255,255,.15);

    outline: none;
}

.progress::-webkit-slider-thumb {

    appearance: none;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #c3c0ff;

    box-shadow:
        0 0 12px rgba(160,155,255,.5);

    cursor: pointer;
}


/* =========================
   FOOTER
========================= */

.footer {

    position: absolute;

    bottom: 22px;
    left: 50%;

    transform: translateX(-50%);

    color: rgba(255,255,255,.25);

    font-size: 11px;

    letter-spacing: 2px;

    direction: ltr;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

    .container {

        width: 88vw;

        min-height: 500px;

        padding: 40px 20px;

        border-radius: 28px;
    }

    .moon {

        width: 130px;
        height: 130px;

        top: 7%;
    }

    .title h1 {

        font-size: 55px;

        margin-bottom: 35px;
    }

    .record {

        width: 150px;
        height: 150px;
    }

    .footer {

        bottom: 12px;
    }
}

</style>
</head>


<body>


<!-- =========================
     NIGHT SKY
========================= -->

<div class="sky">

    <div class="stars">

        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>

        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>

    </div>


    <div class="moon"></div>

    <div class="shooting-star"></div>

    <div class="city"></div>

</div>



<!-- =========================
     MAIN
========================= -->

<main class="container">

    <div class="title">

        <h1>شباهنگ</h1>

    </div>


    <div class="player">

        <div class="record" id="record"></div>

        <div class="song-name">
            My Favorite Song
        </div>

        <button
            class="play-btn"
            id="playBtn">
            ▶
        </button>

        <input
            class="progress"
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0">

    </div>

</main>


<div class="footer">
    MAHDI'S NIGHT
</div>



<audio id="audio">

    <source
        src="./song.mp3"
        type="audio/mpeg">

</audio>



<script>

const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const record = document.getElementById("record");
const progress = document.getElementById("progress");


/* Play / Pause */

playBtn.addEventListener("click", () => {

    if (audio.paused) {

        audio.play();

        playBtn.textContent = "Ⅱ";

        record.classList.add("playing");

    } else {

        audio.pause();

        playBtn.textContent = "▶";

        record.classList.remove("playing");

    }

});


/* Progress */

audio.addEventListener("timeupdate", () => {

    if (!audio.duration) return;

    progress.value =
        (audio.currentTime / audio.duration) * 100;

});


/* Seek */

progress.addEventListener("input", () => {

    if (!audio.duration) return;

    audio.currentTime =
        (progress.value / 100) * audio.duration;

});


/* When song ends */

audio.addEventListener("ended", () => {

    playBtn.textContent = "▶";

    record.classList.remove("playing");

    progress.value = 0;

});

</script>

</body>
</html>
