```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahdi's Night</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 50% 45%,
            #25245f 0%,
            #11143c 30%,
            #070a24 62%,
            #02030d 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   STARS
========================= */

.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

/* Small stars */

.sky::before {
    content: "";

    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(circle, white 1px, transparent 1.5px),
        radial-gradient(circle, #d9ddff 1px, transparent 1.5px),
        radial-gradient(circle, white 0.7px, transparent 1.2px);

    background-size:
        37px 41px,
        61px 73px,
        89px 97px;

    background-position:
        3px 8px,
        17px 31px,
        43px 12px;

    opacity: 0.75;
}

/* Glowing stars */

.star {
    position: absolute;

    width: 4px;
    height: 4px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 5px white,
        0 0 12px #9da7ff;

    animation: sparkle 3s ease-in-out infinite;
}

.star:nth-child(1) { top: 12%; left: 18%; animation-delay: .3s; }
.star:nth-child(2) { top: 23%; left: 35%; animation-delay: 1.2s; }
.star:nth-child(3) { top: 15%; left: 63%; animation-delay: 2s; }
.star:nth-child(4) { top: 31%; left: 77%; animation-delay: .8s; }
.star:nth-child(5) { top: 42%; left: 12%; animation-delay: 1.8s; }
.star:nth-child(6) { top: 52%; left: 25%; animation-delay: .4s; }
.star:nth-child(7) { top: 61%; left: 70%; animation-delay: 2.2s; }
.star:nth-child(8) { top: 73%; left: 83%; animation-delay: 1s; }
.star:nth-child(9) { top: 82%; left: 18%; animation-delay: 2.5s; }
.star:nth-child(10) { top: 67%; left: 48%; animation-delay: 1.5s; }
.star:nth-child(11) { top: 35%; left: 54%; animation-delay: .7s; }
.star:nth-child(12) { top: 18%; left: 88%; animation-delay: 1.7s; }

@keyframes sparkle {
    0%, 100% {
        transform: scale(.6);
        opacity: .3;
    }

    50% {
        transform: scale(1.7);
        opacity: 1;
    }
}

/* =========================
   MOON
========================= */

.moon {
    position: absolute;

    top: 8%;
    right: 10%;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fffde8,
            #fff5bd 55%,
            #e7d889
        );

    box-shadow:
        0 0 20px rgba(255, 247, 190, .9),
        0 0 55px rgba(255, 242, 170, .4),
        0 0 100px rgba(160, 170, 255, .15);

    z-index: 1;
}

/* Moon craters */

.moon::before {
    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: rgba(170, 160, 110, .18);

    top: 28px;
    left: 25px;

    box-shadow:
        38px 10px 0 rgba(170,160,110,.13),
        22px 43px 0 rgba(170,160,110,.15),
        53px 52px 0 rgba(170,160,110,.1);
}

/* Crescent cutout */

.moon::after {
    content: "";

    position: absolute;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    top: -13px;
    left: 34px;

    background: #070a24;
}

/* =========================
   SHOOTING STAR
========================= */

.shooting-star {
    position: absolute;

    width: 130px;
    height: 2px;

    top: 18%;
    left: -150px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.8),
            white
        );

    transform: rotate(-25deg);

    filter:
        drop-shadow(0 0 5px white)
        drop-shadow(0 0 12px #8e9cff);

    animation: shoot 8s linear infinite;

    z-index: 2;
}

@keyframes shoot {

    0% {
        left: -150px;
        top: 15%;
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    22% {
        left: 110%;
        top: 48%;
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}

/* =========================
   ATMOSPHERIC GLOW
========================= */

.glow {
    position: fixed;
    width: 600px;
    height: 600px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(87, 93, 210, .16),
            transparent 70%
        );

    filter: blur(40px);

    pointer-events: none;
}

/* =========================
   MUSIC CARD
========================= */

.card {
    position: relative;

    z-index: 10;

    width: min(420px, 90%);

    padding: 28px;

    text-align: center;

    border-radius: 24px;

    background:
        rgba(8, 11, 38, .72);

    border:
        1px solid rgba(170,180,255,.3);

    box-shadow:
        0 30px 80px rgba(0,0,0,.5),
        inset 0 1px 1px rgba(255,255,255,.08),
        0 0 50px rgba(91,101,220,.12);

    backdrop-filter: blur(18px);
}

/* =========================
   ALBUM
========================= */

.album {
    position: relative;

    width: 240px;
    height: 240px;

    margin: 0 auto 25px;

    overflow: hidden;

    border-radius: 18px;

    background:
        radial-gradient(
            circle at 70% 25%,
            rgba(100,110,220,.5),
            transparent 25%
        ),
        linear-gradient(
            145deg,
            #1c2059,
            #090c2b
        );

    border:
        1px solid rgba(190,195,255,.4);

    box-shadow:
        0 20px 45px rgba(0,0,0,.45);
}

/* Album stars */

.album::before {
    content:
        "✦   ·      ✧      ·   ✦"
        "    ·       ✦      ·"
        "✧      ·     ✦      ·";

    position: absolute;

    inset: 18px;

    color: rgba(255,255,255,.65);

    font-size: 15px;

    line-height: 42px;

    letter-spacing: 4px;
}

/* Album moon */

.album-moon {
    position: absolute;

    width: 65px;
    height: 65px;

    right: 28px;
    top: 28px;

    border-radius: 50%;

    background: #fff5bd;

    box-shadow:
        0 0 18px #fff3b0;
}

.album-moon::after {
    content: "";

    position: absolute;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    top: -8px;
    left: 20px;

    background: #11143c;
}

/* Music symbol */

.music {
    position: absolute;

    left: 50%;
    top: 52%;

    transform: translate(-50%, -50%);

    font-size: 100px;

    color: white;

    text-shadow:
        0 0 12px white,
        0 0 30px #8994ff,
        5px 5px 0 #454b9e;

    animation: musicFloat 3s ease-in-out infinite;
}

@keyframes musicFloat {

    0%, 100% {
        transform: translate(-50%, -50%);
    }

    50% {
        transform: translate(-50%, calc(-50% - 8px));
    }
}

/* =========================
   TITLE
========================= */

h1 {
    font-size: 24px;

    margin-bottom: 8px;

    letter-spacing: .5px;

    text-shadow:
        0 0 15px rgba(180,185,255,.25);
}

.subtitle {
    color: #aeb4df;

    font-size: 13px;

    margin-bottom: 22px;
}

/* =========================
   AUDIO
========================= */

audio {
    width: 100%;
    height: 42px;
}

/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 18px;

    font-size: 11px;

    color: #777fbd;

    letter-spacing: 1px;
}

/* =========================
   GROUND
========================= */

.ground {
    position: fixed;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 55px;

    background:
        linear-gradient(
            180deg,
            rgba(13,16,52,.7),
            #03040f
        );

    border-top:
        1px solid rgba(110,120,210,.2);

    z-index: 3;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .moon {
        width: 80px;
        height: 80px;
        right: 7%;
    }

    .moon::after {
        width: 80px;
        height: 80px;
    }

    .card {
        padding: 22px;
    }

    .album {
        width: 200px;
        height: 200px;
    }

    .music {
        font-size: 80px;
    }
}
</style>
</head>

<body>

<div class="sky">

    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>

</div>

<div class="glow"></div>

<div class="moon"></div>

<div class="shooting-star"></div>

<div class="card">

    <div class="album">

        <div class="album-moon"></div>

        <div class="music">
            ♪
        </div>

    </div>

    <h1>Mahdi's Favorite Song</h1>

    <div class="subtitle">
        A song under the moonlight 🌙
    </div>

    <audio controls>
        <source src="./song.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <div class="footer">
        ✦ Enjoy the music ✦
    </div>

</div>

<div class="ground"></div>

</body>
</html>
```
