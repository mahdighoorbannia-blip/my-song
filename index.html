<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Song</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top left, #5b21b6, transparent 40%),
        radial-gradient(circle at bottom right, #2563eb, transparent 40%),
        #080808;

    color: white;
}

.player {
    width: 90%;
    max-width: 380px;
    padding: 30px;

    text-align: center;

    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;

    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.cover {
    width: 220px;
    height: 220px;

    margin: 0 auto 25px;

    border-radius: 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 80px;

    background: linear-gradient(135deg, #7c3aed, #2563eb);

    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}

h1 {
    margin: 10px 0 5px;
    font-size: 25px;
}

.artist {
    margin-bottom: 25px;
    color: #cccccc;
    font-size: 15px;
}

audio {
    width: 100%;
}

.footer {
    margin-top: 20px;
    font-size: 12px;
    color: #aaaaaa;
}
</style>
</head>

<body>

<div class="player">

    <div class="cover">
        🎵
    </div>

    <h1>My Song</h1>

    <div class="artist">
        Your Favorite Song
    </div>

    <audio controls>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <div class="footer">
        🎧 Listen & Enjoy
    </div>

</div>

</body>
</html>
