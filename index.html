<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mahdi's Favorite Song</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    #7c3aed,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    #2563eb,
                    transparent 35%
                ),
                #050505;

            color: white;
        }

        .player {
            width: 90%;
            max-width: 390px;

            padding: 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 30px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.6);

            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* MUSIC COVER */

        .cover {
            width: 230px;
            height: 230px;

            margin: 0 auto 25px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 25px;

            background:
                radial-gradient(
                    circle at 25% 20%,
                    #ff4ecd,
                    transparent 25%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    #4f46e5,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #111827,
                    #312e81
                );

            box-shadow:
                0 20px 55px rgba(0, 0, 0, 0.55),
                inset 0 0 40px rgba(255, 255, 255, 0.08);

            overflow: hidden;
        }

        /* VINYL */

        .vinyl {
            width: 155px;
            height: 155px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                repeating-radial-gradient(
                    circle,
                    #090909 0px,
                    #090909 3px,
                    #181818 4px,
                    #090909 7px
                );

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.7);

            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* VINYL CENTER */

        .vinyl-center {
            width: 45px;
            height: 45px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ff4ecd,
                    #7c3aed
                );

            color: white;

            font-size: 26px;

            box-shadow:
                0 0 25px rgba(255, 78, 205, 0.5);
        }

        /* TITLE */

        h1 {
            margin: 5px 0 8px;

            font-size: 27px;

            font-weight: 700;

            letter-spacing: 0.3px;
        }

        .subtitle {
            margin-bottom: 25px;

            color: #bdbdbd;

            font-size: 14px;
        }

        /* AUDIO PLAYER */

        audio {
            width: 100%;
        }

        /* FOOTER */

        .footer {
            margin-top: 20px;

            color: #888;

            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="player">

        <div class="cover">

            <div class="vinyl">

                <div class="vinyl-center">
                    ♪
                </div>

            </div>

        </div>

        <h1>Mahdi's Favorite Song</h1>

        <div class="subtitle">
            A collection of songs I love ❤️
        </div>

        <audio controls>
            <source src="./song.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>

        <div class="footer">
            🎧 Enjoy the music
        </div>

    </div>

</body>
</html>
