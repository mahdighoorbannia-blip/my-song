<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahdi's Night</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #020208;
    --purple: #7770ff;
    --purple-light: #a49fff;
    --white: #f4f3ff;
    --muted: rgba(235, 233, 255, 0.35);
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 50% 20%, #17152d 0%, #080714 35%, #020208 75%);
    color: var(--white);
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   STARS
========================= */

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.6;
    animation: twinkle 3s infinite ease-in-out;
}

.star:nth-child(2n) {
    animation-delay: 1s;
}

.star:nth-child(3n) {
    animation-delay: 2s;
}

@keyframes twinkle {
    0%, 100% {
        opacity: 0.2;
        transform: scale(0.8);
    }

    50% {
        opacity: 1;
        transform: scale(1.4);
    }
}

/* =========================
   SHOOTING STAR
========================= */

.shooting-star {
    position: fixed;
    top: 12%;
    left: 75%;
    width: 2px;
    height: 90px;
    background: linear-gradient(
        to bottom,
        transparent,
        rgba(255,255,255,0.8),
        transparent
    );
    transform: rotate(45deg);
    opacity: 0;
    animation: shooting 8s infinite;
}

@keyframes shooting {
    0%, 75% {
        opacity: 0;
        transform: translate(0, 0) rotate(45deg);
    }

    78% {
        opacity: 1;
    }

    83% {
        opacity: 0;
        transform: translate(-300px, 300px) rotate(45deg);
    }

    100% {
        opacity: 0;
    }
}

/* =========================
   MOON
========================= */

.moon {
    position: fixed;
    top: 70px;
    right: 9%;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #eeeaff;
    box-shadow:
        0 0 30px rgba(190,185,255,0.45),
        0 0 90px rgba(120,110,255,0.15);
    z-index: 1;
}

.moon::after {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #090816;
    top: -10px;
    left: 28px;
}

/* =========================
   CITY
========================= */

.city {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 130px;
    display: flex;
    align-items: flex-end;
    gap: 5px;
    z-index: 1;
    opacity: 0.8;
}

.building {
    flex: 1;
    background: linear-gradient(
        to top,
        #05050b,
        #0b0a15
    );
    position: relative;
}

.building::after {
    content: "";
    position: absolute;
    inset: 12px;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,220,130,0.4) 0 4px,
            transparent 4px 17px
        );
    opacity: 0.35;
}

/* =========================
   HEADER
========================= */

header {
    position: relative;
    z-index: 5;
    padding: 28px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
}

.header-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--purple);
    box-shadow: 0 0 15px var(--purple);
}

/* =========================
   MAIN
========================= */

main {
    position: relative;
    z-index: 4;
    min-height: calc(100vh - 80px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px 150px;
}

.frame {
    width: min(1100px, 100%);
    min-height: 650px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 30px;
    background: rgba(8,7,20,0.55);
    backdrop-filter: blur(20px);
    box-shadow:
        0 30px 100px rgba(0,0,0,0.55),
        inset 0 0 50px rgba(120,110,255,0.03);
    display: grid;
    grid-template-columns: 0.9fr 1.4fr;
    overflow: hidden;
}

/* =========================
   LEFT
========================= */

.left {
    padding: 70px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-right: 1px solid rgba(255,255,255,0.06);
}

.small-title {
    color: var(--purple-light);
    letter-spacing: 4px;
    font-size: 12px;
    text-transform: uppercase;
}

.left h1 {
    margin-top: 25px;
    font-size: clamp(60px, 8vw, 110px);
    line-height: 0.82;
    letter-spacing: -6px;
    font-weight: 700;
}

.left h1 span {
    color: var(--purple-light);
}

.description {
    max-width: 300px;
    color: rgba(255,255,255,0.35);
    line-height: 1.8;
    font-size: 14px;
}

/* =========================
   RIGHT PLAYER
========================= */

.player {
    padding: 55px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.song-info {
    margin-bottom: 25px;
}

.song-info .label {
    color: var(--purple-light);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.song-info h2 {
    margin-top: 8px;
    font-size: 28px;
    font-weight: 500;
}

/* =========================
   RECORD
========================= */

.record-area {
    display: flex;
    justify-content: center;
    margin: 10px 0 30px;
}

.record {
    width: 210px;
    height: 210px;
    border-radius: 50%;
    background:
        repeating-radial-gradient(
            circle,
            #09090d 0px,
            #09090d 3px,
            #111116 4px,
            #08080c 7px
        );
    box-shadow:
        0 20px 50px rgba(0,0,0,0.5),
        0 0 30px rgba(120,110,255,0.08);
    position: relative;
}

.record::before {
    content: "";
    position: absolute;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background:
        radial-gradient(circle, #b5b0ff 0 5px, #34305e 6px 18px, #0c0b14 19px);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.record.playing {
    animation: spin 4s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   LYRICS
========================= */

.lyrics-box {
    position: relative;
    height: 190px;
    overflow: hidden;
    margin: 5px 0 25px;
}

.lyrics-box::before,
.lyrics-box::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 55px;
    z-index: 3;
    pointer-events: none;
}

.lyrics-box::before {
    top: 0;
    background: linear-gradient(
        to bottom,
        rgba(8,7,20,1),
        rgba(8,7,20,0)
    );
}

.lyrics-box::after {
    bottom: 0;
    background: linear-gradient(
        to top,
        rgba(8,7,20,1),
        rgba(8,7,20,0)
    );
}

.lyrics {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 15px;
    text-align: center;
    transition: transform 0.65s cubic-bezier(.22,.61,.36,1);
}

.lyric-line {
    color: rgba(235,233,255,0.22);
    font-size: 15px;
    line-height: 1.6;
    transition:
        color 0.6s ease,
        opacity 0.6s ease,
        transform 0.6s ease,
        text-shadow 0.6s ease,
        filter 0.6s ease;
    flex-shrink: 0;
}

.lyric-line.active {
    color: #f5f3ff;
    opacity: 1;
    transform: scale(1.04);
    text-shadow:
        0 0 15px rgba(130,120,255,0.55),
        0 0 35px rgba(130,120,255,0.18);
}

.lyric-line.near {
    color: rgba(235,233,255,0.45);
}

.lyric-line.far {
    opacity: 0.12;
    filter: blur(1px);
}

/* =========================
   CONTROLS
========================= */

.controls {
    margin-top: 5px;
}

.progress {
    width: 100%;
    appearance: none;
    height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--purple-light);
    box-shadow: 0 0 12px var(--purple);
}

.time {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
}

.buttons {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.play-button {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: 1px solid rgba(160,155,255,0.35);
    background: rgba(120,110,255,0.08);
    color: white;
    cursor: pointer;
    font-size: 18px;
    transition: 0.3s;
}

.play-button:hover {
    background: rgba(120,110,255,0.2);
    box-shadow: 0 0 30px rgba(120,110,255,0.2);
    transform: scale(1.05);
}

/* =========================
   VISUALIZER
========================= */

.visualizer {
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    margin-top: 20px;
}

.bar {
    width: 3px;
    height: 8px;
    border-radius: 10px;
    background: var(--purple-light);
    opacity: 0.45;
    transition: height 0.08s ease;
}

/* =========================
   FOOTER
========================= */

footer {
    position: fixed;
    bottom: 15px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 5;
    color: rgba(255,255,255,0.25);
    font-size: 11px;
    letter-spacing: 2px;
}

/* =========================
   CURSOR GLOW
========================= */

.cursor-glow {
    position: fixed;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(120,110,255,0.09),
        transparent 70%
    );
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 2;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .frame {
        grid-template-columns: 1fr;
    }

    .left {
        padding: 45px 35px;
        min-height: 330px;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .left h1 {
        font-size: 70px;
    }

    .description {
        display: none;
    }

    .player {
        padding: 40px 25px;
    }

    .record {
        width: 175px;
        height: 175px;
    }

    .lyrics-box {
        height: 175px;
    }

    .moon {
        width: 80px;
        height: 80px;
        top: 70px;
        right: 7%;
    }

    .moon::after {
        width: 75px;
        height: 75px;
        left: 20px;
        top: -8px;
    }
}
</style>
</head>

<audio id="audio" src="./song.mp3"></audio>


<script>

/* =========================
   AUDIO
========================= */

const audio = document.getElementById("audio");
const playButton = document.getElementById("playButton");
const progress = document.getElementById("progress");
const record = document.getElementById("record");

const currentTimeElement =
    document.getElementById("currentTime");

const durationElement =
    document.getElementById("duration");


/* =========================
   LYRICS
========================= */

const lyricsData = [

    {
        time: 0,
        text: "تو یه شیرینی تلخی واسه قلب نیمه جونم"
    },

    {
        time: 6,
        text: "توی این ترانه هایی که برای تو می خونم"
    },

    {
        time: 12,
        text: "تو یه شیرینی تلخی توی خاطرات دورم"
    },

    {
        time: 18,
        text: "تو تموم لحظه های دل ساکت و صبورم"
    },

    {
        time: 24,
        text: "تو یه رویای قشنگی توی خواب هر شب من"
    },

    {
        time: 30,
        text: "تو یه آه سینه سوزی توی گرمای تب من"
    },

    {
        time: 36,
        text: "تو یه فریاد بلندی تو سکوت بی کسی هام"
    },

    {
        time: 42,
        text: "تو یه عشقی که بریدی من و از دل بستگی هام"
    },

    {
        time: 48,
        text: "کجایی عزیز من بی تو من یه لحظه خوشی ندارم"
    },

    {
        time: 54,
        text: "کجایی که بی تو من غصه می خورم تلخ روزگارم"
    },

    {
        time: 60,
        text: "تو که رفتی از کنارم غم غریبی اومد سراغم"
    },

    {
        time: 66,
        text: "بیا تا دوباره احساس کنم تو دنیا یکی رو دارم"
    },

    {
        time: 72,
        text: "تو یه شیرینی تلخی واسه قلب نیمه جونم"
    },

    {
        time: 78,
        text: "توی این ترانه هایی که برای تو می خونم"
    },

    {
        time: 84,
        text: "تو یه شیرینی تلخی توی خاطرات دورم"
    },

    {
        time: 90,
        text: "تو تموم لحظه های دل ساکت و صبورم"
    },

    {
        time: 96,
        text: "تو یه رویای قشنگی توی خواب هر شب من"
    },

    {
        time: 102,
        text: "تو یه آه سینه سوزی توی گرمای تب من"
    },

    {
        time: 108,
        text: "تو یه فریاد بلندی تو سکوت بی کسی هام"
    },

    {
        time: 114,
        text: "تو یه عشقی که بریدی من و از دل بستگی هام"
    },

    {
        time: 120,
        text: "کجایی عزیز من بی تو من یه لحظه خوشی ندارم"
    },

    {
        time: 126,
        text: "کجایی که بی تو من غصه می خورم تلخ روزگارم"
    },

    {
        time: 132,
        text: "تو که رفتی از کنارم غم غریبی اومد سراغم"
    },

    {
        time: 138,
        text: "بیا تا دوباره احساس کنم تو دنیا یکی رو دارم"
    }

];


/* =========================
   CREATE LYRICS
========================= */

const lyricsContainer =
    document.getElementById("lyrics");

lyricsData.forEach((line, index) => {

    const element = document.createElement("div");

    element.className = "lyric-line";

    element.dataset.index = index;

    element.textContent = line.text;

    lyricsContainer.appendChild(element);

});


const lyricElements =
    document.querySelectorAll(".lyric-line");

let activeLyric = -1;


/* =========================
   UPDATE LYRICS
========================= */

function updateLyrics() {

    const time = audio.currentTime;

    let index = 0;

    for (let i = 0; i < lyricsData.length; i++) {

        if (time >= lyricsData[i].time) {
            index = i;
        } else {
            break;
        }

    }

    if (index === activeLyric) {
        return;
    }

    activeLyric = index;


    lyricElements.forEach((line, i) => {

        line.classList.remove(
            "active",
            "near",
            "far"
        );

        if (i === index) {

            line.classList.add("active");

        } else if (
            i === index - 1 ||
            i === index + 1
        ) {

            line.classList.add("near");

        } else {

            line.classList.add("far");

        }

    });


    /*
       Move the lyrics so the active
       sentence stays in the middle.
    */

    const activeElement =
        lyricElements[index];

    const offset =
        activeElement.offsetTop -
        (lyricsContainer.clientHeight / 2) +
        (activeElement.clientHeight / 2);

    lyricsContainer.style.transform =
        `translateY(${-offset}px)`;

}


/* =========================
   PLAY / PAUSE
========================= */

playButton.addEventListener("click", async () => {

    if (audio.paused) {

        await audio.play();

    } else {

        audio.pause();

    }

});


audio.addEventListener("play", () => {

    playButton.textContent = "Ⅱ";

    record.classList.add("playing");

});


audio.addEventListener("pause", () => {

    playButton.textContent = "▶";

    record.classList.remove("playing");

});


audio.addEventListener("ended", () => {

    playButton.textContent = "▶";

    record.classList.remove("playing");

});


/* =========================
   PROGRESS
========================= */

audio.addEventListener("loadedmetadata", () => {

    durationElement.textContent =
        formatTime(audio.duration);

});


audio.addEventListener("timeupdate", () => {

    if (!audio.duration) return;

    progress.value =
        (audio.currentTime / audio.duration) * 100;

    currentTimeElement.textContent =
        formatTime(audio.currentTime);

    updateLyrics();

});


progress.addEventListener("input", () => {

    if (!audio.duration) return;

    audio.currentTime =
        (progress.value / 100) * audio.duration;

    updateLyrics();

});


/* =========================
   TIME FORMAT
========================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${minutes}:${secs}`;

}


/* =========================
   VISUALIZER
========================= */

const bars =
    document.querySelectorAll(".bar");

let audioContext;
let analyser;
let source;
let visualizerStarted = false;


async function startVisualizer() {

    if (visualizerStarted) return;

    visualizerStarted = true;

    audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    analyser =
        audioContext.createAnalyser();

    analyser.fftSize = 64;

    source =
        audioContext.createMediaElementSource(audio);

    source.connect(analyser);

    analyser.connect(audioContext.destination);

    const data =
        new Uint8Array(analyser.frequencyBinCount);


    function animate() {

        requestAnimationFrame(animate);

        analyser.getByteFrequencyData(data);

        bars.forEach((bar, index) => {

            const value =
                data[index] || 0;

            const height =
                Math.max(
                    6,
                    (value / 255) * 35
                );

            bar.style.height =
                `${height}px`;

        });

    }

    animate();

}


audio.addEventListener("play", () => {

    startVisualizer();

});


/* =========================
   CURSOR GLOW
========================= */

const cursorGlow =
    document.getElementById("cursorGlow");
