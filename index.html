```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mahdi's Favorite Song</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Courier New", monospace;

            background:
                linear-gradient(
                    180deg,
                    #05051a 0%,
                    #0b0b2e 55%,
                    #15104a 100%
                );

            color: white;
        }

        /* STARS */

        .stars,
        .stars2,
        .stars3 {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .stars {
            background-image:
                radial-gradient(circle, white 1px, transparent 1px);
            background-size: 70px 70px;
            opacity: 0.75;
        }

        .stars2 {
            background-image:
                radial-gradient(circle, #ffffff 1.5px, transparent 1.5px);
            background-size: 130px 130px;
            background-position: 30px 40px;
            opacity: 0.6;
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        .stars3 {
            background-image:
                radial-gradient(circle, #ffffff 2px, transparent 2px);
            background-size: 210px 210px;
            background-position: 80px 100px;
            opacity: 0.8;
            animation: twinkle 2s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: 0.25;
            }

            to {
                opacity: 0.95;
            }
        }

        /* MOON */

        .moon {
            position: fixed;

            top: 8%;
            right: 12%;

            width: 95px;
            height: 95px;

            border-radius: 50%;

            background: #fff4b8;

            box-shadow:
                0 0 15px #fff4b8,
                0 0 35px rgba(255, 244, 184, 0.45);

            z-index: 1;
        }

        .moon::after {
            content: "";

            position: absolute;

            width: 95px;
            height: 95px;

            top: -10px;
            left: 28px;

            border-radius: 50%;

            background: #070722;
        }

        /* PIXEL DECORATION */

        .pixel-ground {
            position: fixed;

            bottom: 0;
            left: 0;

            width: 100%;
            height: 90px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #08081f 0px,
                    #08081f 12px,
                    #0d0d2c 12px,
                    #0d0d2c 24px
                );

            border-top: 4px solid #1d1d55;
        }

        /* MUSIC PLAYER */

        .player {
            position: relative;
            z-index: 5;

            width: 90%;
            max-width: 390px;

            padding: 28px;

            text-align: center;

            background: rgba(8, 8, 35, 0.88);

            border: 4px solid #4d4da8;

            box-shadow:
                8px 8px 0 #08081f,
                0 0 35px rgba(90, 90, 255, 0.25);

            border-radius: 4px;
        }

        /* PIXEL COVER */

        .cover {
            width: 220px;
            height: 220px;

            margin: 0 auto 25px;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #15154d,
                    #292978
                );

            border: 4px solid #7777d9;

            box-shadow:
                6px 6px 0 #08081f;

            position: relative;
            overflow: hidden;
        }

        /* MINI MOON ON COVER */

        .cover-moon {
            position: absolute;

            top: 32px;
            right: 35px;

            width: 55px;
            height: 55px;

            border-radius: 50%;

            background: #fff4b8;

            box-shadow:
                0 0 12px #fff4b8;
        }

        .cover-moon::after {
            content: "";

            position: absolute;

            width: 55px;
            height: 55px;

            top: -6px;
            left: 17px;

            border-radius: 50%;

            background: #1b1b55;
        }

        /* PIXEL MUSIC NOTE */

        .note {
            font-size: 80px;

            color: #ffffff;

            text-shadow:
                4px 4px 0 #5555b8,
                0 0 20px rgba(255,255,255,0.5);

            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        h1 {
            margin: 8px 0 10px;

            font-size: 25px;

            letter-spacing: 1px;

            text-shadow:
                3px 3px 0 #15154d;
        }

        .subtitle {
            margin-bottom: 22px;

            color: #aaaadd;

            font-size: 13px;
        }

        audio {
            width: 100%;
        }

        .footer {
            margin-top: 18px;

            color: #7777aa;

            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <div class="moon"></div>

    <div class="player">

        <div class="cover">

            <div class="cover-moon"></div>

            <div class="note">
                ♪
            </div>

        </div>

        <h1>Mahdi's Favorite Song</h1>

        <div class="subtitle">
            A song under the moonlight
        </div>

        <audio controls>
            <source src="./song.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>

        <div class="footer">
            ✦ Enjoy the music ✦
        </div>

    </div>

    <div class="pixel-ground"></div>

</body>
</html>
```
