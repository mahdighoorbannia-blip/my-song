<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آهنگ من 🎵</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Tahoma, Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, #7c3aed, transparent 35%),
                radial-gradient(circle at 80% 80%, #2563eb, transparent 35%),
                #080808;

            color: white;
        }

        .player {
            width: 90%;
            max-width: 380px;
            padding: 30px 25px;

            text-align: center;

            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;

            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
        }

        .cover {
            width: 220px;
            height: 220px;

            margin: 0 auto 25px;

            border-radius: 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 80px;

            background: linear-gradient(135deg, #7c3aed, #2563eb);

            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin: 5px 0 8px;
            font-size: 25px;
        }

        .artist {
            margin-bottom: 25px;
            color: #cccccc;
            font-size: 14px;
        }

        audio {
            width: 100%;
        }

        .footer {
            margin-top: 20px;
            color: #999999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="player">

        <div class="cover">
            🎵
        </div>

        <h1>آهنگ مورد علاقه من</h1>

        <div class="artist">
            گوش بده و لذت ببر ❤️
        </div>

        <audio controls>
            <source src="./song.mp3" type="audio/mpeg">
            مرورگر شما از پخش آهنگ پشتیبانی نمی‌کند.
        </audio>

        <div class="footer">
            🎧 Enjoy the music
        </div>

    </div>

</body>
</html>
