<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahdi's Night</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --black: #020208;
    --deep: #050714;
    --purple: #7770ff;
    --soft-purple: #9a94ff;
    --white: #f2f1ff;
    --muted: #777890;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 45%,
            #11132b 0%,
            #080a18 38%,
            #03040b 72%,
            #010106 100%
        );

    color: var(--white);
    font-family: Georgia, "Times New Roman", serif;
}


/* =========================================================
   MOUSE GLOW
========================================================= */

.cursor-glow {
    position: fixed;

    width: 420px;
    height: 420px;

    border-radius: 50%;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(112,106,255,.09),
            transparent 68%
        );

    transform: translate(-50%, -50%);

    z-index: 20;

    mix-blend-mode: screen;
}


/* =========================================================
   SKY
========================================================= */

.sky {
    position: fixed;
    inset: 0;

    overflow: hidden;

    pointer-events: none;
}


/* tiny distant stars */

.sky::before {
    content: "";

    position: absolute;
    inset: -20px;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.8) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(160,165,255,.6) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.35) 0 .7px,
            transparent 1.2px
        );

    background-size:
        71px 79px,
        113px 127px,
        43px 57px;

    background-position:
        10px 20px,
        30px 70px,
        45px 10px;

    opacity: .42;
}


/* =========================================================
   STARS
========================================================= */

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 5px white,
        0 0 12px rgba(140,145,255,.8);

    animation:
        twinkle var(--speed) ease-in-out infinite;
}

.star:nth-child(1)  { left: 7%;  top: 14%; --speed: 3.2s; }
.star:nth-child(2)  { left: 14%; top: 31%; --speed: 5s; }
.star:nth-child(3)  { left: 22%; top: 10%; --speed: 4s; }
.star:nth-child(4)  { left: 31%; top: 23%; --speed: 6s; }
.star:nth-child(5)  { left: 39%; top: 8%;  --speed: 3.5s; }
.star:nth-child(6)  { left: 47%; top: 28%; --speed: 4.7s; }
.star:nth-child(7)  { left: 55%; top: 13%; --speed: 5.3s; }
.star:nth-child(8)  { left: 64%; top: 7%;  --speed: 3.8s; }
.star:nth-child(9)  { left: 72%; top: 25%; --speed: 5.5s; }
.star:nth-child(10) { left: 81%; top: 12%; --speed: 4.2s; }
.star:nth-child(11) { left: 91%; top: 29%; --speed: 6.2s; }

.star:nth-child(12) { left: 5%;  top: 55%; --speed: 4s; }
.star:nth-child(13) { left: 17%; top: 66%; --speed: 5.4s; }
.star:nth-child(14) { left: 28%; top: 48%; --speed: 3.4s; }
.star:nth-child(15) { left: 38%; top: 67%; --speed: 6s; }
.star:nth-child(16) { left: 51%; top: 54%; --speed: 4.6s; }
.star:nth-child(17) { left: 62%; top: 69%; --speed: 5.7s; }
.star:nth-child(18) { left: 74%; top: 49%; --speed: 3.7s; }
.star:nth-child(19) { left: 86%; top: 61%; --speed: 5s; }
.star:nth-child(20) { left: 95%; top: 48%; --speed: 4.4s; }

.star:nth-child(21) { left: 11%; top: 84%; --speed: 6s; }
.star:nth-child(22) { left: 24%; top: 76%; --speed: 4s; }
.star:nth-child(23) { left: 46%; top: 85%; --speed: 5s; }
.star:nth-child(24) { left: 68%; top: 81%; --speed: 3.6s; }
.star:nth-child(25) { left: 83%; top: 88%; --speed: 5.8s; }

@keyframes twinkle {

    0%,
    100% {
        opacity: .15;
        transform: scale(.6);
    }

    50% {
        opacity: 1;
        transform: scale(2);
    }
}


/* =========================================================
   BRIGHT STARS
========================================================= */

.bright-star {
    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 22px rgba(150,145,255,.9);

    animation: brightTwinkle 3s ease-in-out infinite;
}

.bright-star.one {
    left: 18%;
    top: 18%;
}

.bright-star.two {
    left: 79%;
    top: 34%;

    animation-delay: 1.4s;
}

.bright-star.three {
    left: 57%;
    top: 17%;

    animation-delay: .7s;
}

@keyframes brightTwinkle {

    0%,
    100% {
        opacity: .35;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.8);
    }
}


/* =========================================================
   MOON
========================================================= */

.moon {
    position: fixed;

    width: 190px;
    height: 190px;

    right: 10%;
    top: 8%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fffef0 0%,
            #fff7cf 45%,
            #cfc58e 100%
        );

    box-shadow:
        0 0 25px rgba(255,245,190,.8),
        0 0 80px rgba(255,240,180,.3),
        0 0 150px rgba(210,200,160,.1);

    z-index: 2;
}


/* moon craters */

.moon::before {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 29% 27%,
            rgba(100,95,70,.18) 0 12px,
            transparent 13px
        ),
        radial-gradient(
            circle at 68% 30%,
            rgba(100,95,70,.13) 0 18px,
            transparent 19px
        ),
        radial-gradient(
            circle at 46% 66%,
            rgba(100,95,70,.16) 0 13px,
            transparent 14px
        ),
        radial-gradient(
            circle at 75% 67%,
            rgba(100,95,70,.1) 0 9px,
            transparent 10px
        );
}


/* crescent shadow */

.moon::after {
    content: "";

    position: absolute;

    width: 190px;
    height: 190px;

    border-radius: 50%;

    left: 48px;
    top: -18px;

    background: #050611;
}


/* =========================================================
   SHOOTING STARS
========================================================= */

.shooting {
    position: fixed;

    width: 170px;
    height: 1px;

    left: -220px;
    top: 16%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.4),
            white
        );

    transform: rotate(-27deg);

    box-shadow:
        0 0 7px white,
        0 0 18px #8580ff;

    animation: shooting 12s linear infinite;

    z-index: 3;
}

.shooting.two {
    top: 38%;
    animation-delay: 6s;
    width: 120px;
}

@keyframes shooting {

    0%,
    70% {
        left: -220px;
        opacity: 0;
    }

    72% {
        opacity: 1;
    }

    88% {
        left: 115%;
        opacity: 0;
    }

    100% {
        left: 115%;
        opacity: 0;
    }
}


/* =========================================================
   HORIZON GLOW
========================================================= */

.horizon {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 35%;

    background:
        linear-gradient(
            to top,
            rgba(34,32,82,.32),
            transparent
        );

    pointer-events: none;
}


/* =========================================================
   CITY
========================================================= */

.city {
    position: fixed;

    bottom: 0;
    left: 0;
    right: 0;

    height: 75px;

    display: flex;
    align-items: flex-end;

    gap: 4px;

    opacity: .75;

    pointer-events: none;
}

.building {
    position: relative;

    background: #03040b;

    border-top: 1px solid rgba(110,110,150,.08);
}

.building:nth-child(1) { width: 8%; height: 55%; }
.building:nth-child(2) { width: 6%; height: 85%; }
.building:nth-child(3) { width: 10%; height: 45%; }
.building:nth-child(4) { width: 5%; height: 72%; }
.building:nth-child(5) { width: 11%; height: 95%; }
.building:nth-child(6) { width: 7%; height: 58%; }
.building:nth-child(7) { width: 9%; height: 78%; }
.building:nth-child(8) { width: 6%; height: 50%; }
.building:nth-child(9) { width: 12%; height: 88%; }
.building:nth-child(10) { width: 8%; height: 65%; }
.building:nth-child(11) { width: 12%; height: 80%; }

.window {
    position: absolute;

    width: 3px;
    height: 5px;

    background: #aaa76e;

    box-shadow: 0 0 6px rgba(220,210,120,.35);

    opacity: .55;

    animation: windowBlink 6s ease-in-out infinite;
}

.window:nth-child(1) {
    top: 20%;
    left: 30%;
}

.window:nth-child(2) {
    top: 42%;
    left: 65%;

    animation-delay: 2s;
}

.window:nth-child(3) {
    top: 66%;
    left: 38%;

    animation-delay: 4s;
}

@keyframes windowBlink {

    0%,
    100% {
        opacity: .2;
    }

    50% {
        opacity: .85;
    }
}


/* =========================================================
   AMBIENT LIGHT
========================================================= */

.ambient {
    position: fixed;

    width: 800px;
    height: 800px;

    left: 50%;
    top: 52%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(82,76,180,.13),
            transparent 67%
        );

    filter: blur(35px);

    pointer-events: none;
}


/* =========================================================
   MAIN WRAPPER
========================================================= */

.wrapper {
    position: relative;

    width: min(1080px, 92%);

    height: 100vh;

    margin: auto;

    display: flex;

    align-items: center;

    z-index: 10;
}


/* =========================================================
   GLASS FRAME
========================================================= */

.frame {
    position: relative;

    width: 100%;

    padding: 28px 32px;

    border: 1px solid rgba(255,255,255,.08);

    background:
        linear-gradient(
            135deg,
            rgba(12,13,28,.74),
            rgba(3,4,11,.67)
        );

    backdrop-filter: blur(18px);

    box-shadow:
        0 40px 120px rgba(0,0,0,.65),
        inset 0 1px rgba(255,255,255,.04);

    overflow: hidden;
}


/* frame glow */

.frame::before {
    content: "";

    position: absolute;

    width: 500px;
    height: 500px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(100,94,255,.05),
            transparent 70%
        );

    pointer-events: none;
}


/* corner lines */

.frame::after {
    content: "";

    position: absolute;

    inset: 12px;

    border: 1px solid rgba(140,135,255,.05);

    pointer-events: none;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    position: relative;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding-bottom: 18px;

    border-bottom: 1px solid rgba(255,255,255,.07);

    z-index: 2;
}

.logo {
    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 5px;

    text-transform: uppercase;

    color: #aaa8c5;
}

.status {
    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: #5f6077;
}

.status::before {
    content: "";

    display: inline-block;

    width: 6px;
    height: 6px;

    margin-right: 8px;

    border-radius: 50%;

    background: #7770ff;

    box-shadow:
        0 0 8px #7770ff;

    animation: statusPulse 2s infinite;
}

@keyframes statusPulse {

    50% {
        opacity: .35;
    }
}


/* =========================================================
   CONTENT
========================================================= */

.content {
    position: relative;

    display: grid;

    grid-template-columns: .9fr 1.1fr;

    gap: 70px;

    align-items: center;

    padding: 65px 35px 60px;

    z-index: 2;
}


/* =========================================================
   INTRO
========================================================= */

.intro small {
    display: block;

    margin-bottom: 18px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 4px;

    color: #62647b;

    text-transform: uppercase;
}

.intro h1 {
    font-size: clamp(45px, 6vw, 76px);

    font-weight: normal;

    line-height: .88;

    letter-spacing: -4px;

    margin-bottom: 28px;
}

.intro h1 span {
    color: #8d87ff;

    text-shadow:
        0 0 30px rgba(125,120,255,.3);
}

.intro p {
    max-width: 340px;

    font-family: Arial, sans-serif;

    font-size: 12px;

    line-height: 2;

    color: #73758c;
}


/* tiny quote */

.quote {
    margin-top: 35px;

    padding-left: 15px;

    border-left: 1px solid rgba(140,135,255,.4);

    font-size: 11px;

    font-style: italic;

    color: #57596d;
}


/* =========================================================
   PLAYER
========================================================= */

.player {
    position: relative;

    padding: 30px;

    border: 1px solid rgba(255,255,255,.075);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.012)
        );

    box-shadow:
        inset 0 1px rgba(255,255,255,.035),
        0 20px 50px rgba(0,0,0,.25);
}


/* player top */

.player-top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 3px;

    color: #57586c;

    text-transform: uppercase;
}


/* =========================================================
   VINYL
========================================================= */

.record-wrap {
    position: relative;

    width: 220px;
    height: 220px;

    margin: 0 auto 28px;
}

.record-glow {
    position: absolute;

    inset: -15px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(110,105,255,.13),
            transparent 65%
        );

    filter: blur(12px);

    opacity: .45;

    transition: .5s;
}

.record {
    position: relative;

    width: 220px;
    height: 220px;

    border-radius: 50%;

    background:
        repeating-radial-gradient(
            circle,
            #05050a 0px,
            #05050a 2px,
            #101019 3px,
            #05050a 5px
        );

    border: 1px solid #252531;

    box-shadow:
        0 20px 50px rgba(0,0,0,.65);

    display: flex;

    align-items: center;
    justify-content: center;

    animation: spin 7s linear infinite;

    animation-play-state: paused;
}

.record.playing {
    animation-play-state: running;
}

.record.playing + .record-glow {
    opacity: 1;
    transform: scale(1.15);
}


/* vinyl grooves */

.record::before {
    content: "";

    position: absolute;

    inset: 18px;

    border-radius: 50%;

    border:
        1px solid rgba(255,255,255,.04);

    box-shadow:
        inset 0 0 0 12px rgba(255,255,255,.01),
        inset 0 0 0 24px rgba(255,255,255,.02),
        inset 0 0 0 38px rgba(255,255,255,.015);
}


/* center label */

.record::after {
    content: "♪";

    display: flex;

    align-items: center;
    justify-content: center;

    width: 55px;
    height: 55px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #8580ff,
            #423e9b
        );

    color: white;

    font-size: 24px;

    box-shadow:
        0 0 20px rgba(120,115,255,.25);
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   SONG INFO
========================================================= */

.song-name {
    text-align: center;

    font-size: 21px;

    margin-bottom: 7px;
}

.song-info {
    text-align: center;

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 3px;

    color: #595a70;

    text-transform: uppercase;

    margin-bottom: 25px;
}


/* =========================================================
   VISUALIZER
========================================================= */

.visualizer {
    height: 42px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 3px;

    margin-bottom: 22px;
}

.bar {
    width: 3px;

    height: 5px;

    border-radius: 4px;

    background: #8580ff;

    opacity: .55;

    box-shadow:
        0 0 8px rgba(130,125,255,.4);

    transition: height .08s linear;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {
    display: flex;

    align-items: center;

    gap: 15px;
}

.play {
    flex-shrink: 0;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border: 1px solid rgba(145,140,255,.45);

    background:
        rgba(110,105,255,.09);

    color: white;

    cursor: pointer;

    font-size: 14px;

    transition: .3s;
}

.play:hover {
    transform: scale(1.08);

    background:
        rgba(120,115,255,.18);

    box-shadow:
        0 0 25px rgba(120,115,255,.25);
}

.progress-area {
    flex: 1;
}

.progress {
    width: 100%;

    height: 3px;

    appearance: none;

    border-radius: 5px;

    background: #272735;

    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #aaa6ff;

    box-shadow:
        0 0 12px #7772ff;

    cursor: pointer;
}

.time {
    display: flex;

    justify-content: space-between;

    margin-top: 8px;

    font-family: Arial, sans-serif;

    font-size: 8px;

    color: #505163;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
    position: relative;

    display: flex;

    justify-content: space-between;

    padding: 17px 10px 0;

    border-top: 1px solid rgba(255,255,255,.06);

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 3px;

    color: #484a5b;

    text-transform: uppercase;

    z-index: 2;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 750px) {

    body {
        overflow-y: auto;
    }

    .wrapper {
        width: 94%;

        height: auto;

        min-height: 100vh;

        padding: 30px 0;
    }

    .frame {
        padding: 22px 18px;
    }

    .content {
        grid-template-columns: 1fr;

        gap: 40px;

        padding: 45px 10px;
    }

    .intro {
        text-align: center;
    }

    .intro p {
        margin: auto;
    }

    .quote {
        text-align: left;

        max-width: 280px;

        margin-left: auto;
        margin-right: auto;
    }

    .moon {
        width: 105px;
        height: 105px;

        right: 2%;
        top: 5%;
    }

    .moon::after {
        width: 105px;
        height: 105px;

        left: 27px;
        top: -10px;
    }

    .record-wrap,
    .record {
        width: 185px;
        height: 185px;
    }

    .record::after {
        width: 48px;
        height: 48px;
    }

    .player {
        padding: 24px;
    }

    .footer {
        gap: 15px;

        line-height: 1.7;
    }
}

</style>
</head>

<script>


/* =====================================================
   ELEMENTS
===================================================== */

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("playButton");

const progress =
    document.getElementById("progress");

const record =
    document.getElementById("record");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const bars =
    document.querySelectorAll(".bar");

const cursorGlow =
    document.getElementById("cursorGlow");


/* =====================================================
   TIME
===================================================== */

function formatTime(seconds) {

    if (isNaN(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${minutes}:${secs}`;
}


/* =====================================================
   PLAY
===================================================== */

playButton.addEventListener(
    "click",
    async () => {

        if (audio.paused) {

            try {

                await audio.play();

                playButton.textContent = "Ⅱ";

                record.classList.add(
                    "playing"
                );

            } catch (error) {

                console.log(error);

            }

        } else {

            audio.pause();

            playButton.textContent = "▶";

            record.classList.remove(
                "playing"
            );

        }

    }
);


/* =====================================================
   METADATA
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(audio.duration);

    }
);


/* =====================================================
   PROGRESS
===================================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration) {
            return;
        }

        const percent =
            (audio.currentTime /
            audio.duration) * 100;

        progress.value =
            percent;

        currentTime.textContent =
            formatTime(audio.currentTime);

    }
);


/* =====================================================
   SEEK
===================================================== */

progress.addEventListener(
    "input",
    () => {

        if (!audio.duration) {
            return;
        }

        audio.currentTime =
            (progress.value / 100) *
            audio.duration;

    }
);


/* =====================================================
   END
===================================================== */

audio.addEventListener(
    "ended",
    () => {

        playButton.textContent = "▶";

        record.classList.remove(
            "playing"
        );

        progress.value = 0;

    }
);


/* =====================================================
   REAL AUDIO VISUALIZER
===================================================== */

let audioContext;
let analyser;
let source;
let dataArray;
let visualizerStarted = false;


function startVisualizer() {

    if (visualizerStarted) {
        return;
    }

    visualizerStarted = true;


    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    analyser =
        audioContext.createAnalyser();

    analyser.fftSize = 64;


    source =
        audioContext.createMediaElementSource(
            audio
        );


    source.connect(analyser);

    analyser.connect(
        audioContext.destination
    );


    dataArray =
        new Uint8Array(
            analyser.frequencyBinCount
        );


    animateVisualizer();

}


function animateVisualizer() {

    requestAnimationFrame(
        animateVisualizer
    );


    if (!analyser) {
        return;
    }


    analyser.getByteFrequencyData(
        dataArray
    );


    bars.forEach(
        (bar, index) => {

            const value =
                dataArray[index] || 0;

            const height =
                5 + (value / 255) * 36;

            bar.style.height =
                height + "px";

            bar.style.opacity =
                .35 + (value / 255) * .65;

        }
    );

}


audio.addEventListener(
    "play",
    () => {

        startVisualizer();

        if (
            audioContext &&
            audioContext.state === "suspended"
        ) {
            audioContext.resume();
        }

    }
);


/* =====================================================
   MOUSE LIGHT
===================================================== */

document.addEventListener(
    "mousemove",
    (event) => {

        cursorGlow.style.left =
            event.clientX + "px";

        cursorGlow.style.top =
            event.clientY + "px";

    }
);


/* =====================================================
   HIDE CURSOR LIGHT ON MOBILE
===================================================== */

if (
    window.matchMedia(
        "(pointer: coarse)"
    ).matches
) {

    cursorGlow.style.display = "none";

}


</script>
