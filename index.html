<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahdi — Night Drive</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background: #050509;
}


/* =====================================================
   BACKGROUND
===================================================== */

.scene {
    position: fixed;
    inset: 0;
    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            #050509 0%,
            #090817 48%,
            #130d25 100%
        );
}


/* Huge blurred city lights */

.light {
    position: absolute;

    width: 220px;
    height: 220px;

    border-radius: 50%;

    filter: blur(80px);

    opacity: .35;
}

.light.one {
    background: #624cff;

    left: -60px;
    top: 20%;
}

.light.two {
    background: #ff3f9f;

    right: -80px;
    top: 45%;
}

.light.three {
    background: #2677ff;

    left: 45%;
    bottom: -100px;
}


/* =====================================================
   CITY
===================================================== */

.city {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 38%;

    display: flex;
    align-items: flex-end;

    gap: 8px;

    opacity: .65;
}

.building {
    position: relative;

    width: 8%;
    min-width: 45px;

    background:
        linear-gradient(
            90deg,
            #080810,
            #10101d
        );

    box-shadow:
        inset -5px 0 rgba(255,255,255,.02);
}

.building:nth-child(1) { height: 55%; }
.building:nth-child(2) { height: 75%; }
.building:nth-child(3) { height: 45%; }
.building:nth-child(4) { height: 90%; }
.building:nth-child(5) { height: 65%; }
.building:nth-child(6) { height: 82%; }
.building:nth-child(7) { height: 48%; }
.building:nth-child(8) { height: 72%; }
.building:nth-child(9) { height: 58%; }
.building:nth-child(10) { height: 88%; }
.building:nth-child(11) { height: 62%; }
.building:nth-child(12) { height: 76%; }


/* Windows */

.building::before {
    content: "";

    position: absolute;

    inset: 15px 10px;

    background:
        repeating-linear-gradient(
            180deg,
            rgba(255,205,100,.55) 0 4px,
            transparent 4px 17px
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0 12px,
            rgba(255,205,100,.4) 12px 16px,
            transparent 16px 27px
        );

    opacity: .45;
}


/* =====================================================
   HORIZON
===================================================== */

.horizon {
    position: absolute;

    bottom: 31%;

    width: 100%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff3f9f,
            #7b6cff,
            transparent
        );

    box-shadow:
        0 0 20px #8b6cff;
}


/* =====================================================
   ROAD
===================================================== */

.road {
    position: absolute;

    bottom: 0;

    width: 100%;
    height: 31%;

    background:
        linear-gradient(
            170deg,
            transparent 48%,
            rgba(255,255,255,.04) 49%,
            transparent 50%
        ),
        #05050a;

    transform: perspective(300px) rotateX(8deg);
}


/* Road center lights */

.road::before {
    content: "";

    position: absolute;

    left: 50%;
    bottom: -10px;

    width: 5px;
    height: 100%;

    background:
        repeating-linear-gradient(
            180deg,
            transparent 0 30px,
            rgba(255,255,255,.65) 30px 60px
        );

    transform:
        translateX(-50%)
        perspective(200px)
        rotateX(20deg);

    filter:
        drop-shadow(0 0 8px white);
}


/* =====================================================
   NEON SIGNS
===================================================== */

.sign {
    position: absolute;

    padding: 8px 13px;

    border: 1px solid rgba(255,70,170,.7);

    color: #ff62b2;

    font-size: 10px;

    letter-spacing: 3px;

    text-transform: uppercase;

    box-shadow:
        0 0 10px rgba(255,50,170,.5),
        inset 0 0 10px rgba(255,50,170,.12);

    transform: rotate(-4deg);

    opacity: .55;
}

.sign.one {
    left: 7%;
    bottom: 35%;
}

.sign.two {
    right: 8%;
    bottom: 42%;

    color: #7e8dff;

    border-color: #6978ff;

    box-shadow:
        0 0 10px rgba(80,100,255,.5);
}


/* =====================================================
   MAIN CONTENT
===================================================== */

.content {
    position: relative;

    z-index: 10;

    min-height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding-bottom: 10vh;
}


/* Small label */

.label {
    margin-bottom: 18px;

    font-size: 10px;

    letter-spacing: 7px;

    color: #8f8da5;

    text-transform: uppercase;
}


/* =====================================================
   TITLE
===================================================== */

.title {
    font-size: clamp(48px, 8vw, 88px);

    font-weight: 800;

    letter-spacing: -4px;

    line-height: .9;

    color: #fff;

    text-shadow:
        0 0 25px rgba(255,255,255,.15);

    margin-bottom: 14px;
}

.title span {
    color: #ff4fa8;

    text-shadow:
        0 0 15px rgba(255,50,160,.7),
        0 0 50px rgba(255,50,160,.25);
}


/* Subtitle */

.subtitle {
    color: #8e8ca0;

    font-size: 13px;

    letter-spacing: 3px;

    margin-bottom: 45px;
}


/* =====================================================
   PLAYER
===================================================== */

.player {
    width: min(570px, 88vw);

    padding: 22px 25px;

    display: flex;

    align-items: center;

    gap: 20px;

    background:
        rgba(10,10,17,.82);

    border:
        1px solid rgba(255,255,255,.1);

    box-shadow:
        0 20px 60px rgba(0,0,0,.55);

    backdrop-filter: blur(15px);
}


/* Album mini */

.album {
    flex-shrink: 0;

    width: 68px;
    height: 68px;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            135deg,
            #ff3f9f,
            #604cff
        );

    font-size: 27px;

    box-shadow:
        0 0 25px rgba(255,60,160,.25);
}


/* Player info */

.info {
    flex: 1;

    text-align: left;
}

.song {
    font-size: 14px;

    font-weight: bold;

    margin-bottom: 7px;
}

.artist {
    color: #777589;

    font-size: 11px;

    margin-bottom: 14px;
}


/* Audio */

audio {
    width: 100%;

    height: 32px;
}


/* =====================================================
   EQUALIZER
===================================================== */

.equalizer {
    position: absolute;

    bottom: 8%;

    left: 50%;

    transform: translateX(-50%);

    display: flex;

    align-items: flex-end;

    gap: 5px;

    height: 35px;

    opacity: .25;
}

.equalizer span {
    width: 3px;

    height: 10px;

    background: white;

    animation: equalize 1s ease-in-out infinite alternate;
}

.equalizer span:nth-child(2) { animation-delay: .1s; }
.equalizer span:nth-child(3) { animation-delay: .25s; }
.equalizer span:nth-child(4) { animation-delay: .4s; }
.equalizer span:nth-child(5) { animation-delay: .15s; }
.equalizer span:nth-child(6) { animation-delay: .35s; }
.equalizer span:nth-child(7) { animation-delay: .5s; }
.equalizer span:nth-child(8) { animation-delay: .2s; }

@keyframes equalize {

    from {
        height: 5px;
    }

    to {
        height: 32px;
    }
}


/* =====================================================
   FOOTER
===================================================== */

.footer {
    position: absolute;

    bottom: 4%;

    left: 50%;

    transform: translateX(-50%);

    color: #555361;

    font-size: 9px;

    letter-spacing: 4px;

    text-transform: uppercase;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    .city {
        height: 32%;
    }

    .horizon {
        bottom: 28%;
    }

    .road {
        height: 28%;
    }

    .title {
        letter-spacing: -3px;
    }

    .subtitle {
        margin-bottom: 30px;
    }

    .player {
        padding: 16px;

        gap: 14px;
    }

    .album {
        width: 55px;
        height: 55px;

        font-size: 21px;
    }

    .sign {
        display: none;
    }
}

</style>
</head>

</html>
