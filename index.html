<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahdi — Night</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #02030b;
    color: white;
    font-family: Georgia, "Times New Roman", serif;
}


/* =====================================================
   SKY
===================================================== */

.sky {
    position: fixed;
    inset: 0;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            #151a3d 0%,
            #0b1029 28%,
            #050817 58%,
            #010208 100%
        );
}


/* subtle blue atmosphere */

.sky::before {
    content: "";

    position: absolute;
    width: 900px;
    height: 900px;

    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(85, 104, 220, .13),
            transparent 68%
        );

    filter: blur(45px);
}


/* =====================================================
   STARS
===================================================== */

.stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 5px rgba(255,255,255,.9);

    animation:
        twinkle var(--speed) ease-in-out infinite;
}

@keyframes twinkle {

    0%,
    100% {
        opacity: .15;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}


/* larger stars */

.big-star {
    width: 4px;
    height: 4px;

    box-shadow:
        0 0 7px white,
        0 0 18px rgba(150,165,255,.9);
}


/* =====================================================
   MOON
===================================================== */

.moon {
    position: absolute;

    width: 230px;
    height: 230px;

    right: 12%;
    top: 12%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 34% 30%,
            #fffef2 0%,
            #fff7ce 48%,
            #ded69d 100%
        );

    box-shadow:
        0 0 30px rgba(255,247,205,.65),
        0 0 90px rgba(255,240,190,.27),
        0 0 170px rgba(145,160,255,.13);

    animation:
        moonGlow 6s ease-in-out infinite;
}

@keyframes moonGlow {

    0%,
    100% {
        box-shadow:
            0 0 30px rgba(255,247,205,.65),
            0 0 90px rgba(255,240,190,.27),
            0 0 170px rgba(145,160,255,.13);
    }

    50% {
        box-shadow:
            0 0 40px rgba(255,247,205,.8),
            0 0 110px rgba(255,240,190,.34),
            0 0 190px rgba(145,160,255,.16);
    }
}


/* moon craters */

.moon::before {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 50%;

    background:
        radial-gradient(circle at 25% 28%,
            rgba(120,110,75,.14) 0 12px,
            transparent 13px),

        radial-gradient(circle at 67% 27%,
            rgba(120,110,75,.12) 0 18px,
            transparent 19px),

        radial-gradient(circle at 47% 62%,
            rgba(120,110,75,.14) 0 13px,
            transparent 14px),

        radial-gradient(circle at 72% 67%,
            rgba(120,110,75,.1) 0 9px,
            transparent 10px);
}


/* =====================================================
   CLOUDS
===================================================== */

.clouds {
    position: absolute;
    inset: 0;

    pointer-events: none;
}

.cloud {
    position: absolute;

    width: 480px;
    height: 100px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(90,100,145,.14),
            transparent 70%
        );

    filter: blur(18px);

    opacity: .65;

    animation: cloudMove linear infinite;
}

.cloud:nth-child(1) {
    top: 24%;
    left: -500px;
    animation-duration: 75s;
}

.cloud:nth-child(2) {
    top: 38%;
    left: -600px;
    width: 650px;
    animation-duration: 105s;
    animation-delay: -35s;
}

.cloud:nth-child(3) {
    top: 15%;
    left: -700px;
    width: 350px;
    animation-duration: 120s;
    animation-delay: -60s;
}

@keyframes cloudMove {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(calc(100vw + 800px));
    }
}


/* =====================================================
   SHOOTING STARS
===================================================== */

.shooting {
    position: absolute;

    width: 140px;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            white
        );

    transform: rotate(-25deg);

    filter:
        drop-shadow(0 0 5px white)
        drop-shadow(0 0 12px #9da8ff);

    opacity: 0;
}

.shooting.one {
    top: 20%;
    left: -180px;

    animation: shootingOne 11s linear infinite;
}

.shooting.two {
    top: 32%;
    left: -200px;

    animation: shootingTwo 15s linear infinite;
    animation-delay: 6s;
}

@keyframes shootingOne {

    0%,
    68% {
        opacity: 0;
        transform: translate(0,0) rotate(-25deg);
    }

    70% {
        opacity: 1;
    }

    80% {
        opacity: 0;
        transform: translate(120vw, 48vh) rotate(-25deg);
    }

    100% {
        opacity: 0;
    }
}

@keyframes shootingTwo {

    0%,
    72% {
        opacity: 0;
    }

    74% {
        opacity: 1;
    }

    84% {
        opacity: 0;
        transform: translate(120vw, 42vh) rotate(-25deg);
    }

    100% {
        opacity: 0;
    }
}


/* =====================================================
   DISTANT HILLS
===================================================== */

.horizon {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 24%;

    background:
        linear-gradient(
            160deg,
            transparent 0 18%,
            #050713 18% 100%
        );

    clip-path:
        polygon(
            0 55%,
            8% 45%,
            15% 53%,
            24% 28%,
            32% 49%,
            42% 35%,
            51% 55%,
            60% 30%,
            70% 48%,
            78% 25%,
            88% 50%,
            100% 34%,
            100% 100%,
            0 100%
        );

    z-index: 4;
}


/* second darker layer */

.horizon::after {
    content: "";

    position: absolute;
    inset: 0;

    background: #02030a;

    clip-path:
        polygon(
            0 70%,
            12% 53%,
            22% 67%,
            33% 48%,
            43% 69%,
            54% 52%,
            66% 71%,
            77% 48%,
            88% 65%,
            100% 50%,
            100% 100%,
            0 100%
        );
}


/* =====================================================
   MAIN CONTENT
===================================================== */

.content {
    position: absolute;

    z-index: 10;

    left: 50%;
    top: 53%;

    transform: translate(-50%, -50%);

    width: min(900px, 90%);

    text-align: center;
}


/* tiny label */

.label {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 6px;

    text-transform: uppercase;

    color: rgba(210,215,255,.48);

    margin-bottom: 25px;

    opacity: 0;

    animation: appear 2s ease forwards;
}


/* main title */

.title {
    font-size: clamp(55px, 10vw, 115px);

    font-weight: normal;

    letter-spacing: -5px;

    line-height: .9;

    color: #f4f3ff;

    text-shadow:
        0 0 35px rgba(180,185,255,.12);

    opacity: 0;

    animation:
        titleAppear 2s cubic-bezier(.2,.7,.2,1) .3s forwards;
}

.title span {
    color: #aaa7ff;

    font-style: italic;

    text-shadow:
        0 0 35px rgba(130,125,255,.35);
}


@keyframes titleAppear {

    from {
        opacity: 0;
        transform: translateY(25px);
        filter: blur(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

@keyframes appear {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* subtitle */

.subtitle {
    margin-top: 25px;

    font-size: 14px;

    color: rgba(220,222,245,.52);

    letter-spacing: 1px;

    opacity: 0;

    animation:
        appear 2s ease 1s forwards;
}


/* =====================================================
   MUSIC PLAYER
===================================================== */

.music {
    display: flex;

    align-items: center;

    gap: 18px;

    width: min(420px, 90%);

    margin: 45px auto 0;

    padding: 13px 17px;

    border-radius: 50px;

    background:
        rgba(5,6,16,.58);

    border:
        1px solid rgba(210,215,255,.11);

    box-shadow:
        0 15px 50px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.035);

    backdrop-filter: blur(15px);

    opacity: 0;

    animation:
        appear 2s ease 1.3s forwards;
}


/* play button */

.play {
    flex-shrink: 0;

    width: 42px;
    height: 42px;

    border: 1px solid rgba(180,180,255,.3);

    border-radius: 50%;

    background: rgba(120,120,220,.1);

    color: white;

    cursor: pointer;

    font-size: 13px;

    transition: .3s;
}

.play:hover {
    background: rgba(140,135,255,.2);

    box-shadow:
        0 0 25px rgba(130,125,255,.25);

    transform: scale(1.06);
}


/* song section */

.song {
    flex: 1;

    min-width: 0;

    text-align: left;
}

.song-title {
    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 1px;

    color: #d7d6e7;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.song-subtitle {
    margin-top: 5px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    color: #656579;
}


/* progress */

.progress {
    width: 100%;

    height: 2px;

    margin-top: 8px;

    appearance: none;

    background: rgba(255,255,255,.1);

    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #aaa7ff;

    box-shadow:
        0 0 8px #8985ff;
}


/* time */

.time {
    font-family: Arial, sans-serif;

    font-size: 8px;

    color: #555568;

    min-width: 30px;
}


/* =====================================================
   BOTTOM TEXT
===================================================== */

.bottom {
    position: fixed;

    z-index: 20;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    color: rgba(190,195,230,.25);

    text-transform: uppercase;

    white-space: nowrap;
}


/* =====================================================
   PLAYING ATMOSPHERE
===================================================== */

body.playing .moon {
    animation-duration: 3s;
}

body.playing .ambient {
    opacity: 1;
}

body.playing .title span {
    text-shadow:
        0 0 45px rgba(130,125,255,.5);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .moon {
        width: 130px;
        height: 130px;

        right: 8%;
        top: 10%;
    }

    .content {
        top: 55%;
    }

    .title {
        font-size: 65px;

        letter-spacing: -3px;
    }

    .subtitle {
        font-size: 12px;
        max-width: 280px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.7;
    }

    .music {
        margin-top: 35px;
    }

    .horizon {
        height: 20%;
    }

    .bottom {
        bottom: 15px;
        font-size: 7px;
    }
}

@media (max-width: 430px) {

    .moon {
        width: 105px;
        height: 105px;
    }

    .title {
        font-size: 54px;
    }

    .music {
        padding: 10px 12px;
        gap: 11px;
    }

    .play {
        width: 38px;
        height: 38px;
    }
}

</style>
</head>

            </div>

                playing under the moonlight
            </div>

                class="progress"
                type="range"

     AUDIO
================================================== -->

<audio id="audio">

    <source
        src="./song.mp3"
        type="audio/mpeg">

</audio>


<script>

const audio =
    document.getElementById("audio");

const play =
    document.getElementById("play");

const progress =
    document.getElementById("progress");

const time =
    document.getElementById("time");


function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return minutes + ":" + secs;
}


play.addEventListener("click", () => {

    if (audio.paused) {

        audio.play();

        play.textContent = "Ⅱ";

        document.body.classList.add("playing");

    } else {

        audio.pause();

        play.textContent = "▶";

        document.body.classList.remove("playing");

    }

});


audio.addEventListener("loadedmetadata", () => {

    time.textContent =
        formatTime(audio.duration);

});


audio.addEventListener("timeupdate", () => {

    if (!audio.duration) return;

    progress.value =
        (audio.currentTime / audio.duration) * 100;

    time.textContent =
        formatTime(audio.currentTime);

});


progress.addEventListener("input", () => {

    if (!audio.duration) return;

    audio.currentTime =
        (progress.value / 100) *
        audio.duration;

});


audio.addEventListener("ended", () => {

    play.textContent = "▶";

    document.body.classList.remove("playing");

    progress.value = 0;

    time.textContent = "0:00";

});

</script>
