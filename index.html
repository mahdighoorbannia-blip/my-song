<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahdi's Night</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #020208;
    --purple: #7770ff;
    --soft: #aaa6ff;
    --white: #eeeefe;
    --muted: #686a82;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            #11142c 0%,
            #080a18 40%,
            #03040b 72%,
            #010106 100%
        );

    color: var(--white);

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =====================================================
   MOUSE GLOW
===================================================== */

.cursor-glow {
    position: fixed;

    width: 450px;
    height: 450px;

    border-radius: 50%;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(110,105,255,.085),
            transparent 68%
        );

    transform: translate(-50%, -50%);

    z-index: 30;
}


/* =====================================================
   SKY
===================================================== */

.sky {
    position: fixed;
    inset: 0;

    overflow: hidden;

    pointer-events: none;
}

.sky::before {
    content: "";

    position: absolute;
    inset: -30px;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.85) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(170,175,255,.65) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.3) 0 .7px,
            transparent 1.2px
        );

    background-size:
        73px 81px,
        127px 139px,
        47px 61px;

    opacity: .4;
}


/* =====================================================
   STARS
===================================================== */

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 5px white,
        0 0 13px rgba(130,135,255,.8);

    animation:
        twinkle var(--speed) ease-in-out infinite;
}

.star:nth-child(1)  { left: 7%;  top: 13%; --speed: 3.5s; }
.star:nth-child(2)  { left: 15%; top: 31%; --speed: 5s; }
.star:nth-child(3)  { left: 24%; top: 9%;  --speed: 4s; }
.star:nth-child(4)  { left: 34%; top: 23%; --speed: 6s; }
.star:nth-child(5)  { left: 44%; top: 7%;  --speed: 3.8s; }
.star:nth-child(6)  { left: 54%; top: 27%; --speed: 5.2s; }
.star:nth-child(7)  { left: 65%; top: 12%; --speed: 4.5s; }
.star:nth-child(8)  { left: 76%; top: 24%; --speed: 5.8s; }
.star:nth-child(9)  { left: 87%; top: 10%; --speed: 4.2s; }
.star:nth-child(10) { left: 94%; top: 35%; --speed: 6.2s; }

.star:nth-child(11) { left: 8%;  top: 55%; --speed: 4s; }
.star:nth-child(12) { left: 19%; top: 69%; --speed: 5.5s; }
.star:nth-child(13) { left: 31%; top: 50%; --speed: 3.6s; }
.star:nth-child(14) { left: 43%; top: 73%; --speed: 6s; }
.star:nth-child(15) { left: 56%; top: 58%; --speed: 4.7s; }
.star:nth-child(16) { left: 68%; top: 72%; --speed: 5.8s; }
.star:nth-child(17) { left: 81%; top: 51%; --speed: 3.8s; }
.star:nth-child(18) { left: 93%; top: 66%; --speed: 5s; }

.star:nth-child(19) { left: 13%; top: 87%; --speed: 5.7s; }
.star:nth-child(20) { left: 29%; top: 82%; --speed: 4.3s; }
.star:nth-child(21) { left: 51%; top: 88%; --speed: 6s; }
.star:nth-child(22) { left: 73%; top: 84%; --speed: 4s; }
.star:nth-child(23) { left: 88%; top: 91%; --speed: 5.2s; }


@keyframes twinkle {

    0%,
    100% {
        opacity: .12;
        transform: scale(.6);
    }

    50% {
        opacity: 1;
        transform: scale(1.8);
    }
}


/* =====================================================
   SPECIAL STARS
===================================================== */

.bright-star {
    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 22px #7770ff;

    animation:
        bright 3s ease-in-out infinite;
}

.bright-star.one {
    left: 21%;
    top: 17%;
}

.bright-star.two {
    left: 72%;
    top: 39%;

    animation-delay: 1.2s;
}

.bright-star.three {
    left: 57%;
    top: 15%;

    animation-delay: .5s;
}

@keyframes bright {

    0%,
    100% {
        opacity: .25;
        transform: scale(.6);
    }

    50% {
        opacity: 1;
        transform: scale(1.8);
    }
}


/* =====================================================
   MOON
===================================================== */

.moon {
    position: fixed;

    width: 180px;
    height: 180px;

    right: 9%;
    top: 8%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fffef1 0%,
            #fff5c8 45%,
            #d2c794 100%
        );

    box-shadow:
        0 0 30px rgba(255,245,190,.8),
        0 0 90px rgba(255,240,180,.3),
        0 0 160px rgba(220,210,160,.08);

    z-index: 2;
}

.moon::before {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(100,95,70,.16) 0 12px,
            transparent 13px
        ),
        radial-gradient(
            circle at 68% 30%,
            rgba(100,95,70,.13) 0 17px,
            transparent 18px
        ),
        radial-gradient(
            circle at 47% 68%,
            rgba(100,95,70,.15) 0 13px,
            transparent 14px
        );
}

.moon::after {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    left: 45px;
    top: -17px;

    border-radius: 50%;

    background: #050611;
}


/* =====================================================
   SHOOTING STARS
===================================================== */

.shooting {
    position: fixed;

    width: 170px;
    height: 1px;

    left: -220px;
    top: 18%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            white
        );

    transform: rotate(-27deg);

    box-shadow:
        0 0 7px white,
        0 0 18px #7770ff;

    animation:
        shooting 12s linear infinite;

    z-index: 3;
}

.shooting.two {
    top: 43%;
    width: 120px;
    animation-delay: 6s;
}

@keyframes shooting {

    0%,
    70% {
        left: -220px;
        opacity: 0;
    }

    73% {
        opacity: 1;
    }

    88% {
        left: 115%;
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}


/* =====================================================
   HORIZON
===================================================== */

.horizon {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 38%;

    background:
        linear-gradient(
            to top,
            rgba(36,34,90,.35),
            transparent
        );

    pointer-events: none;
}


/* =====================================================
   CITY
===================================================== */

.city {
    position: fixed;

    bottom: 0;
    left: 0;
    right: 0;

    height: 70px;

    display: flex;

    align-items: flex-end;

    gap: 3px;

    pointer-events: none;

    opacity: .8;
}

.building {
    position: relative;

    flex: 1;

    max-width: 130px;

    background: #03040b;

    border-top: 1px solid rgba(120,120,160,.08);
}

.building:nth-child(1) { height: 55%; }
.building:nth-child(2) { height: 82%; }
.building:nth-child(3) { height: 47%; }
.building:nth-child(4) { height: 70%; }
.building:nth-child(5) { height: 95%; }
.building:nth-child(6) { height: 61%; }
.building:nth-child(7) { height: 80%; }
.building:nth-child(8) { height: 52%; }
.building:nth-child(9) { height: 88%; }
.building:nth-child(10) { height: 66%; }

.window {
    position: absolute;

    width: 3px;
    height: 5px;

    background: #aaa66c;

    box-shadow:
        0 0 6px rgba(220,210,120,.35);

    opacity: .5;

    animation:
        windowBlink 6s ease-in-out infinite;
}

.window:nth-child(1) {
    top: 22%;
    left: 30%;
}

.window:nth-child(2) {
    top: 45%;
    left: 65%;
    animation-delay: 2s;
}

.window:nth-child(3) {
    top: 68%;
    left: 42%;
    animation-delay: 4s;
}

@keyframes windowBlink {

    0%,
    100% {
        opacity: .15;
    }

    50% {
        opacity: .8;
    }
}


/* =====================================================
   AMBIENT
===================================================== */

.ambient {
    position: fixed;

    width: 850px;
    height: 850px;

    left: 50%;
    top: 52%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(85,78,190,.14),
            transparent 68%
        );

    filter: blur(40px);

    pointer-events: none;
}


/* =====================================================
   MAIN
===================================================== */

.wrapper {
    position: relative;

    width: min(1050px, 92%);

    height: 100vh;

    margin: auto;

    display: flex;

    align-items: center;

    z-index: 10;
}


/* =====================================================
   FRAME
===================================================== */

.frame {
    position: relative;

    width: 100%;

    padding: 26px 30px;

    border: 1px solid rgba(255,255,255,.075);

    background:
        linear-gradient(
            135deg,
            rgba(10,11,25,.7),
            rgba(3,4,10,.62)
        );

    backdrop-filter: blur(20px);

    box-shadow:
        0 40px 120px rgba(0,0,0,.65),
        inset 0 1px rgba(255,255,255,.035);

    overflow: hidden;
}

.frame::before {
    content: "";

    position: absolute;

    width: 300px;
    height: 100%;

    top: 0;
    left: -350px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(130,125,255,.035),
            transparent
        );

    transform: skewX(-20deg);

    animation:
        sweep 9s ease-in-out infinite;
}

@keyframes sweep {

    0%,
    65% {
        left: -350px;
    }

    85% {
        left: 110%;
    }

    100% {
        left: 110%;
    }
}


/* =====================================================
   HEADER
===================================================== */

.header {
    position: relative;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding-bottom: 16px;

    border-bottom: 1px solid rgba(255,255,255,.06);

    z-index: 2;
}

.logo {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 5px;

    color: #85869b;

    text-transform: uppercase;
}

.status {
    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 3px;

    color: #55566a;

    text-transform: uppercase;
}

.status::before {
    content: "";

    display: inline-block;

    width: 5px;
    height: 5px;

    margin-right: 7px;

    border-radius: 50%;

    background: #7770ff;

    box-shadow:
        0 0 9px #7770ff;

    animation:
        pulse 2s infinite;
}

@keyframes pulse {

    50% {
        opacity: .25;
    }
}


/* =====================================================
   CONTENT
===================================================== */

.content {
    position: relative;

    display: grid;

    grid-template-columns: .85fr 1.15fr;

    gap: 70px;

    align-items: center;

    padding: 45px 35px;

    z-index: 2;
}


/* =====================================================
   LEFT
===================================================== */

.intro small {
    display: block;

    margin-bottom: 18px;

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 4px;

    color: #55576b;

    text-transform: uppercase;
}

.intro h1 {
    font-size: clamp(48px, 6vw, 78px);

    font-weight: normal;

    line-height: .87;

    letter-spacing: -4px;
}

.intro h1 span {
    color: #8c87ff;

    text-shadow:
        0 0 35px rgba(125,120,255,.35);
}


/* =====================================================
   PLAYER
===================================================== */

.player {
    position: relative;

    padding: 25px;

    border: 1px solid rgba(255,255,255,.065);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        );

    box-shadow:
        inset 0 1px rgba(255,255,255,.03),
        0 25px 60px rgba(0,0,0,.25);
}


/* =====================================================
   PLAYER TOP
===================================================== */

.player-top {
    display: flex;

    justify-content: space-between;

    margin-bottom: 15px;

    font-family: Arial, sans-serif;

    font-size: 7px;

    letter-spacing: 3px;

    color: #505165;

    text-transform: uppercase;
}


/* =====================================================
   RECORD
===================================================== */

.record-wrap {
    position: relative;

    width: 200px;
    height: 200px;

    margin: 0 auto 18px;
}

.record-glow {
    position: absolute;

    inset: -20px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(105,100,255,.14),
            transparent 65%
        );

    filter: blur(13px);

    opacity: .4;

    transition: .6s;
}

.record {
    position: relative;

    width: 200px;
    height: 200px;

    border-radius: 50%;

    background:
        repeating-radial-gradient(
            circle,
            #05050a 0px,
            #05050a 2px,
            #101019 3px,
            #05050a 5px
        );

    border: 1px solid #292934;

    box-shadow:
        0 25px 55px rgba(0,0,0,.65);

    display: flex;

    align-items: center;
    justify-content: center;

    animation:
        spin 7s linear infinite;

    animation-play-state: paused;
}

.record.playing {
    animation-play-state: running;
}

.record.playing + .record-glow {
    opacity: 1;
    transform: scale(1.15);
}

.record::before {
    content: "";

    position: absolute;

    inset: 17px;

    border-radius: 50%;

    border:
        1px solid rgba(255,255,255,.035);

    box-shadow:
        inset 0 0 0 12px rgba(255,255,255,.01),
        inset 0 0 0 25px rgba(255,255,255,.018),
        inset 0 0 0 40px rgba(255,255,255,.012);
}

.record::after {
    content: "♪";

    display: flex;

    align-items: center;
    justify-content: center;

    width: 54px;
    height: 54px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #8580ff,
            #3f3b98
        );

    color: white;

    font-size: 23px;

    box-shadow:
        0 0 25px rgba(120,115,255,.25);
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}


/* =====================================================
   SONG
===================================================== */

.song-name {
    text-align: center;

    font-size: 20px;

    margin-bottom: 12px;
}


/* =====================================================
   LYRICS
===================================================== */

.lyrics-title {
    margin-bottom: 8px;

    font-family: Arial, sans-serif;

    font-size: 7px;

    letter-spacing: 3px;

    color: #505165;

    text-transform: uppercase;

    text-align: center;
}

.lyrics-box {

    height: 145px;

    overflow-y: auto;

    overflow-x: hidden;

    padding: 10px 14px;

    margin-bottom: 16px;

    border-top:
        1px solid rgba(255,255,255,.04);

    border-bottom:
        1px solid rgba(255,255,255,.04);

    direction: rtl;

    overscroll-behavior: contain;

    scrollbar-width: thin;

    scrollbar-color:
        #45415f
        transparent;
}


/*
   IMPORTANT:
   Lyrics are completely static.
   No highlight.
   No animation.
   No color change.
*/

.lyrics-box p {

    margin: 0 0 11px 0;

    color: #77788c;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size: 13px;

    line-height: 1.9;

    text-align: center;

    direction: rtl;

    font-weight: normal;

    transition: none;

    animation: none;

    text-shadow: none;
}

.lyrics-box p:last-child {
    margin-bottom: 0;
}


/* SCROLLBAR */

.lyrics-box::-webkit-scrollbar {
    width: 4px;
}

.lyrics-box::-webkit-scrollbar-track {
    background: transparent;
}

.lyrics-box::-webkit-scrollbar-thumb {
    background: #45415f;

    border-radius: 10px;
}

.lyrics-box::-webkit-scrollbar-thumb:hover {
    background: #45415f;
}


/* =====================================================
   VISUALIZER
===================================================== */

.visualizer {
    height: 32px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 3px;

    margin-bottom: 15px;
}

.bar {
    width: 3px;

    height: 4px;

    border-radius: 5px;

    background: #8580ff;

    opacity: .5;

    box-shadow:
        0 0 8px rgba(130,125,255,.45);

    transition:
        height .08s linear;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls {
    display: flex;

    align-items: center;

    gap: 14px;
}

.play {
    flex-shrink: 0;

    width: 47px;
    height: 47px;

    border-radius: 50%;

    border: 1px solid rgba(145,140,255,.4);

    background:
        rgba(110,105,255,.08);

    color: white;

    cursor: pointer;

    font-size: 14px;

    transition: .3s;
}

.play:hover {
    transform: scale(1.08);

    background:
        rgba(120,115,255,.18);

    box-shadow:
        0 0 28px rgba(120,115,255,.25);
}

.progress-area {
    flex: 1;
}

.progress {
    width: 100%;

    height: 3px;

    appearance: none;

    border-radius: 5px;

    background: #292936;

    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #aaa6ff;

    box-shadow:
        0 0 12px #7772ff;
}

.time {
    display: flex;

    justify-content: space-between;

    margin-top: 8px;

    font-family: Arial, sans-serif;

    font-size: 8px;

    color: #4e5060;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {
    position: relative;

    display: flex;

    justify-content: space-between;

    padding: 15px 8px 0;

    border-top: 1px solid rgba(255,255,255,.055);

    font-family: Arial, sans-serif;

    font-size: 7px;

    letter-spacing: 3px;

    color: #414352;

    text-transform: uppercase;

    z-index: 2;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 750px) {

    body {
        overflow-y: auto;
    }

    .wrapper {
        width: 94%;

        height: auto;

        min-height: 100vh;

        padding: 25px 0;
    }

    .frame {
        padding: 22px 16px;
    }

    .content {
        grid-template-columns: 1fr;

        gap: 35px;

        padding: 42px 8px;
    }

    .intro {
        text-align: center;
    }

    .moon {
        width: 105px;
        height: 105px;

        right: 2%;
        top: 5%;
    }

    .moon::after {
        width: 105px;
        height: 105px;

        left: 27px;
        top: -10px;
    }

    .record-wrap,
    .record {
        width: 185px;
        height: 185px;
    }

    .record::after {
        width: 48px;
        height: 48px;
    }

    .player {
        padding: 24px;
    }

    .lyrics-box {
        height: 210px;
    }

    .lyrics-box p {
        font-size: 13px;
        line-height: 1.9;
    }

    .footer {
        gap: 15px;

        line-height: 1.7;
    }
}

</style>
</head>

<script>


/* =====================================================
   ELEMENTS
===================================================== */

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("playButton");

const progress =
    document.getElementById("progress");

const record =
    document.getElementById("record");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const bars =
    document.querySelectorAll(".bar");

const cursorGlow =
    document.getElementById("cursorGlow");


/* =====================================================
   TIME
===================================================== */

function formatTime(seconds) {

    if (isNaN(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${minutes}:${secs}`;
}


/* =====================================================
   PLAY
===================================================== */

playButton.addEventListener(
    "click",
    async () => {

        if (audio.paused) {

            try {

                await audio.play();

                playButton.textContent = "Ⅱ";

                record.classList.add(
                    "playing"
                );

            } catch (error) {

                console.log(error);

            }

        } else {

            audio.pause();

            playButton.textContent = "▶";

            record.classList.remove(
                "playing"
            );

        }

    }
);


/* =====================================================
   METADATA
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(audio.duration);

    }
);


/* =====================================================
   PROGRESS
===================================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration) {
            return;
        }

        progress.value =
            (audio.currentTime /
            audio.duration) * 100;

        currentTime.textContent =
            formatTime(audio.currentTime);

    }
);


/* =====================================================
   SEEK
===================================================== */

progress.addEventListener(
    "input",
    () => {

        if (!audio.duration) {
            return;
        }

        audio.currentTime =
            (progress.value / 100) *
            audio.duration;

    }
);


/* =====================================================
   END
===================================================== */

audio.addEventListener(
    "ended",
    () => {

        playButton.textContent = "▶";

        record.classList.remove(
            "playing"
        );

        progress.value = 0;

    }
);


/* =====================================================
   AUDIO VISUALIZER
===================================================== */

let audioContext;
let analyser;
let source;
let dataArray;
let visualizerStarted = false;


function startVisualizer() {

    if (visualizerStarted) {
        return;
    }

    visualizerStarted = true;

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    analyser =
        audioContext.createAnalyser();

    analyser.fftSize = 64;

    source =
        audioContext.createMediaElementSource(
            audio
        );

    source.connect(analyser);

    analyser.connect(
        audioContext.destination
    );

    dataArray =
        new Uint8Array(
            analyser.frequencyBinCount
        );

    animateVisualizer();
}


function animateVisualizer() {

    requestAnimationFrame(
        animateVisualizer
    );

    if (!analyser) {
        return;
    }

    analyser.getByteFrequencyData(
        dataArray
    );

    bars.forEach(
        (bar, index) => {

            const value =
                dataArray[index] || 0;

            const height =
                4 +
                (value / 255) * 28;

            bar.style.height =
                height + "px";

            bar.style.opacity =
                .3 +
                (value / 255) * .7;

        }
    );
}


audio.addEventListener(
    "play",
    () => {

        startVisualizer();

        if (
            audioContext &&
            audioContext.state === "suspended"
        ) {

            audioContext.resume();

        }

    }
);


/* =====================================================
   MOUSE LIGHT
===================================================== */

document.addEventListener(
    "mousemove",
    (event) => {

        cursorGlow.style.left =
            event.clientX + "px";

        cursorGlow.style.top =
            event.clientY + "px";

    }
);


/* =====================================================
   MOBILE
===================================================== */

if (
    window.matchMedia(
        "(pointer: coarse)"
    ).matches
) {

    cursorGlow.style.display =
        "none";

}

</script>
