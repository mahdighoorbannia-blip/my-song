<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahdi's Night</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #090704;
    --purple: #d88a32;
    --purple-soft: #f2b65d;
    --white: #eeeeff;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: var(--bg);
    color: var(--white);
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* =========================
   BACKGROUND
========================= */

.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(181,91,25,.16),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #03030c 0%,
            #020208 100%
        );
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: .7;
    animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {

    0%, 100% {
        opacity: .25;
    }

    50% {
        opacity: 1;
    }

}

.moon {
    position: absolute;

    top: 8%;
    right: 12%;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    background: #eeeefe;

    box-shadow:
        0 0 25px rgba(255,178,83,.34),
        0 0 80px rgba(255,145,45,.12);
}

.moon::after {
    content: "";

    position: absolute;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    background: #100b07;

    left: 30px;
    top: -12px;
}

/* =========================
   SHOOTING STARS
========================= */

.shooting-star {
    position: absolute;

    width: 90px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #fff
        );

    transform: rotate(-35deg);

    opacity: 0;

    animation: shooting 7s infinite;
}

.shooting-star.one {
    top: 20%;
    left: 10%;
}

.shooting-star.two {
    top: 35%;
    right: 15%;
    animation-delay: 3s;
}

@keyframes shooting {

    0%, 80% {
        opacity: 0;
        transform:
            translate(0,0)
            rotate(-35deg);
    }

    83% {
        opacity: 1;
    }

    90% {
        opacity: 0;
        transform:
            translate(180px,110px)
            rotate(-35deg);
    }

    100% {
        opacity: 0;
    }

}

/* =========================
   CITY
========================= */

.city {
    position: fixed;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 120px;

    display: flex;
    align-items: flex-end;
    gap: 4px;

    opacity: .52;
    filter: drop-shadow(0 -3px 12px rgba(189, 93, 29, .08));
}

.building {
    background: #05050d;

    border-top:
        1px solid
        rgba(255,255,255,.03);
}

.building:nth-child(1) {
    width: 7%;
    height: 50%;
}

.building:nth-child(2) {
    width: 9%;
    height: 75%;
}

.building:nth-child(3) {
    width: 6%;
    height: 40%;
}

.building:nth-child(4) {
    width: 10%;
    height: 90%;
}

.building:nth-child(5) {
    width: 8%;
    height: 60%;
}

.building:nth-child(6) {
    width: 12%;
    height: 80%;
}

.building:nth-child(7) {
    width: 7%;
    height: 45%;
}

.building:nth-child(8) {
    width: 10%;
    height: 70%;
}

.building:nth-child(9) {
    width: 8%;
    height: 55%;
}

.building:nth-child(10) {
    width: 10%;
    height: 85%;
}

.building:nth-child(11) {
    width: 8%;
    height: 50%;
}

.building:nth-child(12) {
    width: 10%;
    height: 65%;
}

/* =========================
   FRAME
========================= */

.frame {
    position: relative;
    z-index: 5;

    width: min(1100px, 92%);

    margin: 40px auto;

    border:
        1px solid
        rgba(232,158,75,.22);

    background:
        rgba(18,12,7,.78);

    backdrop-filter: blur(18px);

    box-shadow:
        0 0 60px rgba(214,115,35,.09),
        inset 0 0 50px
        rgba(230,145,55,.025);

    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
    height: 70px;

    padding: 0 30px;

    display: flex;

    justify-content: space-between;
    align-items: center;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}

.logo {
    font-size: 18px;
    letter-spacing: 5px;
    color: #fff;
}

.status {
    font-size: 11px;
    letter-spacing: 3px;

    color:
        rgba(238,238,254,.4);
}

/* =========================
   CONTENT
========================= */

.content {
    display: grid;

    grid-template-columns:
        1fr 1.5fr;
}

.left {
    padding: 45px;

    border-right:
        1px solid
        rgba(255,255,255,.05);

    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.small-title {
    font-size: 10px;

    letter-spacing: 4px;

    color:
        rgba(238,238,254,.3);

    text-transform: uppercase;
}

.big-title {
    margin-top: 15px;

    font-size:
        clamp(32px, 5vw, 65px);

    font-weight: 300;

    letter-spacing: -3px;
}

.subtitle {
    margin-top: 15px;

    color:
        rgba(238,238,254,.4);

    font-size: 13px;

    line-height: 1.8;
}

/* =========================
   PLAYER
========================= */

.player {
    padding: 30px 40px;

    display: flex;
    flex-direction: column;

    min-width: 0;
}

.track-info {
    display: flex;

    justify-content: space-between;
    align-items: center;
}

.track-number {
    font-size: 11px;

    letter-spacing: 3px;

    color:
        rgba(238,238,254,.35);
}

.now-playing {
    font-size: 10px;

    letter-spacing: 3px;

    color: var(--purple-soft);
}

/* =========================
   RECORD
========================= */

.record-wrap {
    display: flex;

    justify-content: center;
    align-items: center;

    margin: 18px 0;
}

.record {
    width: 110px;
    height: 110px;

    border-radius: 50%;

    background:
        repeating-radial-gradient(
            circle,
            #0b0b13 0px,
            #0b0b13 2px,
            #171720 3px,
            #08080e 5px
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 0 35px
        rgba(224,139,53,.18),

        inset 0 0 15px
        rgba(255,255,255,.05);

    position: relative;
}

.record::before {
    content: "";

    position: absolute;

    width: 32px;
    height: 32px;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #090910;

    border:
        5px solid
        #e8a044;

    box-shadow:
        0 0 15px
        rgba(255,173,76,.38);
}

.record.playing {
    animation:
        spin 5s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

/* =========================
   SONG TITLE
========================= */

.song-title {
    text-align: center;

    font-size: 18px;

    margin-bottom: 10px;
}

/* =========================
   LYRICS
========================= */

.lyrics-box {

    height: auto;

    overflow: visible;

    padding: 8px 10px;

    direction: rtl;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}

.lyrics {
    direction: rtl;

    padding: 5px;

    white-space: pre-line;
}

.lyric-line {

    white-space: pre-line;

    text-align: center;

    color:
        rgba(225,222,255,.82);

    font-size: 14px;

    line-height: 1.9;

    padding: 3px 8px;

    cursor: default;

    transition: none;
    animation: none;
    transform: none;
    opacity: 1;

    text-shadow:
        0 0 12px
        rgba(255,177,88,.16);
}



/* =========================
   MOON DECORATION BESIDE LYRICS
========================= */
.lyrics > .lyric-line.lyric-decorated {
    display: flex;
    flex-wrap: nowrap;
    align-items: baseline;
    justify-content: center;
    column-gap: 10px;
    white-space: normal;
    padding: 5px 4px;
    line-height: 2.15;
}

.lyric-words {
    display: inline;
    white-space: pre-wrap;
    min-width: 0;
}

.lyric-moon {
    display: inline-block;
    flex: 0 0 auto;
    font-size: .9em;
    line-height: 1;
    color: #f5c477;
    filter: drop-shadow(0 0 5px rgba(255, 185, 92, .35));
    transform-origin: center;
    animation: moonFloat 1.8s ease-in-out infinite alternate;
}

/* دو هلال کنار هر خط شعر، با حرکت نرم و نور بنفش */
.lyric-moon:first-child {
    animation-delay: -.9s;
}

.lyric-moon:last-child {
    animation-delay: 0s;
    animation-direction: alternate-reverse;
}

@keyframes moonFloat {
    from {
        transform: translateY(2px) rotate(-12deg) scale(.92);
        filter: drop-shadow(0 0 3px rgba(255, 185, 92, .25));
    }
    to {
        transform: translateY(-3px) rotate(12deg) scale(1.12);
        filter: drop-shadow(0 0 9px rgba(255, 202, 124, .75));
    }
}

@media (prefers-reduced-motion: reduce) {
    .lyric-moon {
        animation: none;
    }
}

@media (max-width: 480px) {
    .lyrics > .lyric-line.lyric-decorated {
        column-gap: 6px;
        padding-inline: 0;
    }
    .lyric-words {
        overflow-wrap: anywhere;
    }
    .lyric-moon {
        font-size: .8em;
    }
}

/* =========================
   VISUALIZER
========================= */

.visualizer {
    height: 30px;

    margin-top: 10px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 4px;
}

.bar {
    width: 3px;
    height: 8px;

    background:
        rgba(238,163,74,.72);

    border-radius: 5px;
}

.visualizer.playing .bar {
    animation:
        bars .8s infinite ease-in-out;
}

.bar:nth-child(1) {
    animation-delay: .1s;
}

.bar:nth-child(2) {
    animation-delay: .2s;
}

.bar:nth-child(3) {
    animation-delay: .3s;
}

.bar:nth-child(4) {
    animation-delay: .4s;
}

.bar:nth-child(5) {
    animation-delay: .5s;
}

.bar:nth-child(6) {
    animation-delay: .4s;
}

.bar:nth-child(7) {
    animation-delay: .3s;
}

.bar:nth-child(8) {
    animation-delay: .2s;
}

.bar:nth-child(9) {
    animation-delay: .1s;
}

@keyframes bars {

    0%, 100% {
        height: 7px;
    }

    50% {
        height: 28px;
    }

}

/* =========================
   PROGRESS
========================= */

.progress-area {
    margin-top: 5px;
}

.progress {
    width: 100%;

    height: 3px;

    appearance: none;

    background:
        rgba(255,255,255,.08);

    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #f2b65d;
}

.time {
    display: flex;

    justify-content: space-between;

    margin-top: 8px;

    font-size: 10px;

    color:
        rgba(238,238,254,.3);
}

/* =========================
   CONTROLS
========================= */

.controls {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 25px;

    margin-top: 12px;
}

.control {
    width: 40px;
    height: 40px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.02);

    color:
        rgba(238,238,254,.7);

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    transition: .2s;
}

.control:hover {
    border-color:
        rgba(255,178,83,.5);

    color: #fff;
}

.play {
    width: 48px;
    height: 48px;

    border-color:
        rgba(255,178,83,.4);

    color: #ffd18a;
}

/* =========================
   FOOTER
========================= */

.footer {
    height: 45px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-top:
        1px solid
        rgba(255,255,255,.05);

    color:
        rgba(238,238,254,.22);

    font-size: 9px;

    letter-spacing: 3px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 750px) {

    .frame {
        width: 94%;
        margin: 20px auto;
    }

    .content {
        grid-template-columns: 1fr;
    }

    .left {
        border-right: none;

        border-bottom:
            1px solid
            rgba(255,255,255,.05);

        padding: 30px;
    }

    .player {
        padding: 25px 18px;
    }

    .moon {
        width: 70px;
        height: 70px;
    }

    .moon::after {
        width: 70px;
        height: 70px;

        left: 20px;
    }

}


/* =========================
   AUTUMN ATMOSPHERE
========================= */
.sky {
    background:
        radial-gradient(ellipse at 18% 78%, rgba(177, 76, 20, .12), transparent 34%),
        radial-gradient(ellipse at 82% 35%, rgba(214, 133, 39, .10), transparent 30%),
        radial-gradient(circle at 50% 25%, rgba(130, 75, 25, .12), transparent 38%),
        linear-gradient(180deg, #100b07 0%, #080604 100%);
}
.frame {
    border-color: rgba(224, 157, 77, .22);
    box-shadow: 0 0 65px rgba(175, 89, 25, .08), inset 0 0 50px rgba(230, 145, 55, .025);
}
.logo { color: #f6d7a5; }
.now-playing { color: #e9ad5c; }
.record::before { border-color: #d88a32; }
.lyric-line { text-shadow: 0 0 12px rgba(255, 174, 77, .10); }
.lyric-moon { color: #f5c477; }
.control:hover { border-color: rgba(255, 178, 83, .45); }
.progress::-webkit-slider-thumb { background: #f2b65d; }
.bar { background: rgba(238, 163, 74, .72); }




/* =========================
   SENTENCE-BY-SENTENCE KARAOKE
========================= */
.lyrics-box {
    max-height: 310px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(242,182,93,.35) transparent;
}
.lyrics {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    direction: rtl;
    padding: 12px 5px;
}
.karaoke-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: 5px;
    direction: rtl;
    text-align: center;
    line-height: 2.1;
    width: 100%;
}
.karaoke-word {
    display: inline-block;
    color: rgba(225,222,255,.62);
    font-size: 15px;
    font-weight: 400;
    padding: 1px 2px;
    border-radius: 5px;
    transition: color .12s ease, text-shadow .12s ease, transform .12s ease;
}
.karaoke-word.active {
    color: #ffd18a;
    font-weight: 800;
    text-shadow: 0 0 7px rgba(255,184,91,.85), 0 0 19px rgba(255,153,48,.45);
    transform: scale(1.08);
}
.karaoke-word.past { color: rgba(242,182,93,.88); }
.karaoke-row .lyric-moon { margin: 0 3px; }
@media (max-width: 480px) {
    .lyrics-box { max-height: 280px; }
    .karaoke-word { font-size: 14px; }
}

</style>
</head>

</audio>


<script>

const audio =
    document.getElementById("audio");

const playBtn =
    document.getElementById("play");

const record =
    document.getElementById("record");

const visualizer =
    document.getElementById("visualizer");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const back =
    document.getElementById("back");

const forward =
    document.getElementById("forward");


function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${minutes}:${secs}`;

}


audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(audio.duration);
        progress.value = 0;

    }
);


audio.addEventListener(
    "timeupdate",
    () => {

        currentTime.textContent =
            formatTime(audio.currentTime);

        if (Number.isFinite(audio.duration) && audio.duration > 0) {
            progress.value = (audio.currentTime / audio.duration) * 100;
        }

    }
);


playBtn.addEventListener("click", async () => {
    if (audio.paused) {
        try {
            await audio.play();
        } catch (error) {
            // Keep the interface paused if the file is missing or playback is blocked.
            syncPlayerState();
            console.error("پخش آهنگ انجام نشد:", error);
        }
    } else {
        audio.pause();
    }
});

function syncPlayerState() {
    const isPlaying = !audio.paused && !audio.ended;
    playBtn.textContent = isPlaying ? "Ⅱ" : "▶";
    playBtn.setAttribute("aria-label", isPlaying ? "توقف موقت آهنگ" : "پخش آهنگ");
    record.classList.toggle("playing", isPlaying);
    visualizer.classList.toggle("playing", isPlaying);
}

audio.addEventListener("play", syncPlayerState);
audio.addEventListener("pause", syncPlayerState);
audio.addEventListener("ended", syncPlayerState);


progress.addEventListener(
    "input",
    () => {

        if (Number.isFinite(audio.duration) && audio.duration > 0) {
            audio.currentTime = (Number(progress.value) / 100) * audio.duration;
        }

    }
);


back.addEventListener(
    "click",
    () => {

        audio.currentTime =
            Math.max(
                0,
                audio.currentTime - 15
            );

    }
);


forward.addEventListener(
    "click",
    () => {

        audio.currentTime =
            Math.min(
                audio.duration || 0,
                audio.currentTime + 15
            );

    }
);


audio.addEventListener("ended", () => {
    updateKaraoke(0);
    progress.value = 0;
    currentTime.textContent = "0:00";
    syncPlayerState();
});

// Sentence-by-sentence karaoke timestamps (seconds, based on the supplied timecodes).
const karaokeCues = [[30.35, 37.23, "دلخوری از بغض پری می فهمم"], [37.23, 44.07, "ناراحتی غصه داری می فهمم"], [44.07, 50.9, "دلواپس فردای با من بودنی"], [50.9, 56.73, "دلگیری از من اما درگیر منی"], [56.73, 63.56, "داری دل می زنی دل می کنی تو کم کم"], [63.56, 70.0, "من بهت حق میدم من حالتو می فهمم"], [70.0, 77.0, "داری دل می زنی دل می کنی تو کم کم"], [77.0, 83.0, "من بهت حق میدم من حالتو می فهمم"], [83.0, 91.0, "نبض احساستو می گیرم و حالت خوش نیست"], [91.0, 97.01, "این دفعه نیت من خیره تو فالت خوش نیست"], [97.01, 105.0, "دارم می بازمت ای داد بیداد"], [105.0, 112.0, "خودم کردم که لعنت بر خودم باد"], [112.0, 118.61, "دارم می بازمت ای داد بیداد"], [118.61, 124.61, "خودم کردم که لعنت بر خودم باد"]];
const lyricsElement = document.getElementById("lyrics");
const karaokeWords = [];

karaokeCues.forEach(([start, end, text]) => {
    const row = document.createElement("div");
    row.className = "karaoke-row";

    const leftMoon = document.createElement("span");
    leftMoon.className = "lyric-moon";
    leftMoon.textContent = "☾";
    leftMoon.setAttribute("aria-hidden", "true");
    row.appendChild(leftMoon);

    const sentence = document.createElement("span");
    sentence.className = "karaoke-word";
    sentence.textContent = text;
    sentence.dataset.start = start;
    sentence.dataset.end = end;
    row.appendChild(sentence);

    const rightMoon = document.createElement("span");
    rightMoon.className = "lyric-moon";
    rightMoon.textContent = "☽";
    rightMoon.setAttribute("aria-hidden", "true");
    row.appendChild(rightMoon);

    lyricsElement.appendChild(row);
    karaokeWords.push({ start, end, element: sentence });
});

let activeCueIndex = -1;
function updateKaraoke(time) {
    let low = 0;
    let high = karaokeWords.length - 1;
    let found = -1;
    while (low <= high) {
        const mid = (low + high) >> 1;
        const cue = karaokeWords[mid];
        if (time < cue.start) high = mid - 1;
        else if (time >= cue.end) low = mid + 1;
        else { found = mid; break; }
    }
    if (found === activeCueIndex) return;
    activeCueIndex = found;
    karaokeWords.forEach((cue, index) => {
        cue.element.classList.toggle("active", index === found);
        cue.element.classList.toggle("past", found >= 0 && index < found);
    });
    if (found >= 0) {
        const row = karaokeWords[found].element.parentElement;
        const box = document.querySelector(".lyrics-box");
        const rowTop = row.offsetTop;
        const rowBottom = rowTop + row.offsetHeight;
        if (rowTop < box.scrollTop || rowBottom > box.scrollTop + box.clientHeight) {
            row.scrollIntoView({ behavior: "smooth", block: "center" });
        }
    }
}

audio.addEventListener("timeupdate", () => updateKaraoke(audio.currentTime));
audio.addEventListener("seeked", () => updateKaraoke(audio.currentTime));
