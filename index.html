<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mahdi's Night</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(circle at 50% 25%, #17233d 0%, #090d18 35%, #03050a 75%);
            color: #fff;
            font-family: "Segoe UI", Arial, sans-serif;
            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .night {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1.5px),
                radial-gradient(circle, rgba(150,190,255,.7) 1px, transparent 1.5px),
                radial-gradient(circle, rgba(255,255,255,.5) 1px, transparent 1.5px);
            background-size: 95px 95px, 150px 150px, 220px 220px;
            background-position: 10px 20px, 40px 70px, 90px 30px;
            opacity: .55;
            animation: starsMove 35s linear infinite;
        }

        @keyframes starsMove {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-80px);
            }
        }

        .moon {
            position: absolute;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            top: 9%;
            right: 11%;

            background:
                radial-gradient(circle at 35% 30%,
                #ffffff 0%,
                #dfe8ff 42%,
                #9caecc 75%,
                #66738d 100%);

            box-shadow:
                0 0 25px rgba(180,210,255,.25),
                0 0 80px rgba(130,165,255,.12);

            opacity: .8;
        }

        .moon::after {
            content: "";
            position: absolute;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: #060912;
            left: 65px;
            top: -10px;
        }

        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            left: 50%;
            top: 40%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(55, 90, 170, .08);
            filter: blur(70px);
        }

        /* =========================
           MAIN
        ========================= */

        .page {
            position: relative;
            z-index: 2;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 45px 20px;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            width: min(1050px, 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 5px;
            margin-bottom: 70px;
        }

        .logo {
            font-size: 17px;
            letter-spacing: 5px;
            color: #dbe6ff;
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 9px;

            color: #71809e;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #6dffb0;
            box-shadow: 0 0 12px rgba(109,255,176,.8);
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            text-align: center;
            margin-bottom: 42px;
        }

        .hero small {
            display: block;
            color: #697895;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 17px;
        }

        .hero h1 {
            font-size: clamp(42px, 7vw, 78px);
            font-weight: 300;
            letter-spacing: -2px;
            line-height: 1;

            background: linear-gradient(
                180deg,
                #ffffff,
                #aebbd4
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-shadow: 0 0 35px rgba(150,180,255,.12);
        }

        .hero p {
            margin-top: 18px;
            color: #626f89;
            font-size: 13px;
            letter-spacing: 2px;
        }

        /* =========================
           PLAYER
        ========================= */

        .player {
            width: min(480px, 100%);

            padding: 27px;

            background:
                linear-gradient(
                    145deg,
                    rgba(24,32,52,.88),
                    rgba(7,11,20,.94)
                );

            border: 1px solid rgba(150,175,220,.13);
            border-radius: 22px;

            box-shadow:
                0 30px 80px rgba(0,0,0,.55),
                inset 0 1px rgba(255,255,255,.035);

            backdrop-filter: blur(15px);
        }

        /* =========================
           COVER
        ========================= */

        .cover {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;

            border-radius: 15px;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 42%,
                    #34486e,
                    #151e32 35%,
                    #080c15 70%
                );

            box-shadow:
                0 18px 50px rgba(0,0,0,.45);

            margin-bottom: 25px;
        }

        .cover::before {
            content: "♪";

            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 110px;
            font-weight: 200;

            color: rgba(220,230,255,.13);

            text-shadow:
                0 0 35px rgba(170,200,255,.2);
        }

        .cover::after {
            content: "";

            position: absolute;
            width: 150px;
            height: 150px;

            border-radius: 50%;

            background: rgba(160,190,255,.08);

            filter: blur(30px);

            top: 25%;
            left: 30%;
        }

        /* =========================
           SONG INFO
        ========================= */

        .song-info {
            margin-bottom: 22px;
        }

        .song-title {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: .5px;
        }

        .artist {
            margin-top: 6px;
            color: #687691;
            font-size: 13px;
        }

        /* =========================
           PROGRESS
        ========================= */

        .progress-area {
            margin-bottom: 8px;
        }

        .progress {
            width: 100%;
            height: 4px;

            appearance: none;
            -webkit-appearance: none;

            background: #202a3d;
            border-radius: 20px;
            outline: none;

            cursor: pointer;
        }

        .progress::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;

            border-radius: 50%;
            background: #dce7ff;

            box-shadow:
                0 0 12px rgba(190,215,255,.5);

            cursor: pointer;
        }

        .progress::-moz-range-thumb {
            width: 12px;
            height: 12px;

            border: none;
            border-radius: 50%;
            background: #dce7ff;

            cursor: pointer;
        }

        .time {
            display: flex;
            justify-content: space-between;

            color: #536078;
            font-size: 10px;
            margin-top: 8px;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 28px;

            margin-top: 20px;
        }

        .control {
            border: none;
            background: transparent;

            color: #8997b2;

            font-size: 18px;

            cursor: pointer;

            transition:
                transform .2s ease,
                color .2s ease;
        }

        .control:hover {
            color: #ffffff;
            transform: scale(1.15);
        }

        .play {
            width: 58px;
            height: 58px;

            border-radius: 50%;

            border: 1px solid rgba(220,230,255,.25);

            background:
                linear-gradient(
                    145deg,
                    #dce7ff,
                    #8999b8
                );

            color: #080c15;

            font-size: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-shadow:
                0 8px 30px rgba(120,150,210,.22);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .play:hover {
            transform: scale(1.08);

            box-shadow:
                0 10px 40px rgba(140,175,240,.35);
        }

        /* =========================
           VOLUME
        ========================= */

        .volume {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-top: 25px;

            color: #56647d;
        }

        .volume span {
            font-size: 13px;
        }

        .volume input {
            flex: 1;
            height: 3px;
            appearance: none;
            -webkit-appearance: none;

            background: #202a3d;
            border-radius: 10px;
        }

        .volume input::-webkit-slider-thumb {
            appearance: none;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #9aaaca;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 60px;

            color: #39445a;

            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page {
                padding: 28px 16px;
            }

            header {
                margin-bottom: 55px;
            }

            .logo {
                font-size: 13px;
                letter-spacing: 3px;
            }

            .status {
                font-size: 9px;
            }

            .moon {
                width: 150px;
                height: 150px;

                top: 8%;
                right: -35px;
            }

            .moon::after {
                width: 150px;
                height: 150px;
                left: 40px;
            }

            .hero h1 {
                font-size: 48px;
            }

            .hero p {
                font-size: 10px;
            }

            .player {
                padding: 20px;
                border-radius: 18px;
            }

            .controls {
                gap: 23px;
            }

            footer {
                margin-top: 45px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NIGHT BACKGROUND
    ========================= -->

    <div class="night">
        <div class="stars"></div>
        <div class="moon"></div>
        <div class="glow"></div>
    </div>


    <!-- =========================
         PAGE
    ========================= -->

    <main class="page">

        <header>

            <div class="logo">
                MAHDI'S NIGHT
            </div>

            <div class="status">
                <span class="status-dot"></span>
                listening
            </div>

        </header>


        <!-- =========================
             HERO
        ========================= -->

        <section class="hero">

            <small>late night music</small>

            <h1>Lost in Music</h1>

            <p>put your headphones on.</p>

        </section>


        <!-- =========================
             MUSIC PLAYER
        ========================= -->

        <section class="player">

            <div class="cover"></div>


            <div class="song-info">

                <div class="song-title">
                    Your Favorite Song
                </div>

                <div class="artist">
                    Mahdi
                </div>

            </div>


            <div class="progress-area">

                <input
                    type="range"
                    class="progress"
                    id="progress"
                    value="0"
                    min="0"
                    step="0.1"
                >

                <div class="time">

                    <span id="currentTime">
                        0:00
                    </span>

                    <span id="duration">
                        0:00
                    </span>

                </div>

            </div>


            <div class="controls">

                <button
                    class="control"
                    id="backBtn"
                >
                    ↶
                </button>


                <button
                    class="play"
                    id="playBtn"
                >
                    ▶
                </button>


                <button
                    class="control"
                    id="forwardBtn"
                >
                    ↷
                </button>

            </div>


            <div class="volume">

                <span>♪</span>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.7"
                >

            </div>

        </section>


        <footer>
            made for quiet nights
        </footer>

    </main>


    <!-- =========================
         AUDIO
    ========================= -->

    <audio id="audio" src="song.mp3"></audio>


    <script>

        const audio = document.getElementById("audio");

        const playBtn = document.getElementById("playBtn");

        const progress = document.getElementById("progress");

        const volume = document.getElementById("volume");

        const currentTime = document.getElementById("currentTime");

        const duration = document.getElementById("duration");

        const backBtn = document.getElementById("backBtn");

        const forwardBtn = document.getElementById("forwardBtn");


        /* =========================
           PLAY / PAUSE
        ========================= */

        playBtn.addEventListener("click", () => {

            if (audio.paused) {

                audio.play();

                playBtn.textContent = "Ⅱ";

            } else {

                audio.pause();

                playBtn.textContent = "▶";

            }

        });


        /* =========================
           AUDIO LOADED
        ========================= */

        audio.addEventListener("loadedmetadata", () => {

            progress.max = audio.duration;

            duration.textContent =
                formatTime(audio.duration);

        });


        /* =========================
           PROGRESS UPDATE
        ========================= */

        audio.addEventListener("timeupdate", () => {

            progress.value = audio.currentTime;

            currentTime.textContent =
                formatTime(audio.currentTime);

        });


        /* =========================
           SEEK
        ========================= */

        progress.addEventListener("input", () => {

            audio.currentTime = progress.value;

        });


        /* =========================
           VOLUME
        ========================= */

        volume.addEventListener("input", () => {

            audio.volume = volume.value;

        });


        audio.volume = 0.7;


        /* =========================
           BACK 10 SEC
        ========================= */

        backBtn.addEventListener("click", () => {

            audio.currentTime =
                Math.max(0, audio.currentTime - 10);

        });


        /* =========================
           FORWARD 10 SEC
        ========================= */

        forwardBtn.addEventListener("click", () => {

            audio.currentTime =
                Math.min(
                    audio.duration,
                    audio.currentTime + 10
                );

        });


        /* =========================
           SONG ENDED
        ========================= */

        audio.addEventListener("ended", () => {

            playBtn.textContent = "▶";

            progress.value = 0;

        });


        /* =========================
           TIME FORMAT
        ========================= */

        function formatTime(seconds) {

            if (!isFinite(seconds)) {
                return "0:00";
            }

            const minutes =
                Math.floor(seconds / 60);

            const secs =
                Math.floor(seconds % 60)
                .toString()
                .padStart(2, "0");

            return `${minutes}:${secs}`;

        }

    </script>

</body>
</html>
